        var stars = sf.querySelectorAll('.star-point');
        var lines = sf.querySelectorAll('.star-constellation-line');
        stars.forEach(function(s) { s.style.display = 'none'; s.style.pointerEvents = 'none'; });
        lines.forEach(function(l) { l.style.display = 'none'; });
        var list = sf.querySelector('.starfield-list');
        if (!list) {
            list = document.createElement('div');
            list.className = 'starfield-list';
            sf.appendChild(list);
        }
        list.innerHTML = '';
        list.classList.add('active');
        timelineData.forEach(function(era, i) {
            var entry = document.createElement('div');
            entry.className = 'sl-entry' + (era.type === 'branch' ? ' branch-marker' : '');
            entry.style.animationDelay = (i * 0.04) + 's';
            entry.innerHTML = '<span class="sl-index">' + String(i + 1).padStart(2, '0') + '</span>'
                + '<span class="sl-marker"></span>'
                + '<span class="sl-name">' + era.name + '</span>'
                + '<span class="sl-time">' + era.time + '</span>';
            (function(eid) {
                entry.addEventListener('click', function() { starClick(eid); });
            })(era.id);
            list.appendChild(entry);
        });
    }

    var hudTypingTimer = null;
    var hudBarsTimer = null;

    function startHudTyping() {
        if (hudTypingTimer) clearTimeout(hudTypingTimer);
        var lines = [];
        timelineData.forEach(function(era) {
            if (era.desc) { era.desc.forEach(function(d) { if (d.indexOf('【结局】') === -1 && d.indexOf('【内容】') === -1) lines.push(d); }); }
            if (era.summary) lines.push(era.summary);
        });
        if (lines.length === 0) return;
        function cycle() {
            var textEl = document.getElementById('hud-typing-text');
            if (!textEl) { hudTypingTimer = setTimeout(cycle, 2000); return; }
            var line = lines[Math.floor(Math.random() * lines.length)];
            var i = 0;
            textEl.textContent = '';
            function type() {
                if (i < line.length) {
                    textEl.textContent = line.substring(0, i + 1);
                    i++;
                    hudTypingTimer = setTimeout(type, 40 + Math.random() * 30);
                } else {
                    hudTypingTimer = setTimeout(function() {
                        textEl.textContent = '';
                        hudTypingTimer = setTimeout(cycle, 800 + Math.random() * 1500);
                    }, 2200 + Math.random() * 2000);
                }
            }
            type();
        }
        cycle();
    }

    function startHudBars() {
        if (hudBarsTimer) clearInterval(hudBarsTimer);
        hudBarsTimer = setInterval(function() {
            var pwrBar = document.getElementById('hud-pwr-bar');
            var pwrVal = document.getElementById('hud-pwr-val');
            var scnBar = document.getElementById('hud-scn-bar');
            var scnVal = document.getElementById('hud-scn-val');
            if (pwrBar && pwrVal) {
                var pwr = 82 + Math.floor(Math.random() * 14);
                pwrBar.style.width = pwr + '%';
                pwrVal.textContent = pwr + '%';
            }
            if (scnBar && scnVal) {
                var scn = 30 + Math.floor(Math.random() * 50);
                scnBar.style.width = scn + '%';
                scnVal.textContent = scn + '%';
            }
        }, 1800);
    }

    (function initMouseParallax() {
        var main = document.getElementById('main');
        var targetX = 0, targetY = 0, currentX = 0, currentY = 0;
        main.addEventListener('mousemove', function(e) {
            var rect = main.getBoundingClientRect();
            var cx = rect.width / 2, cy = rect.height / 2;
            targetX = (e.clientX - rect.left - cx) / cx * 10;
            targetY = (e.clientY - rect.top - cy) / cy * 10;
        });
        main.addEventListener('mouseleave', function() { targetX = 0; targetY = 0; });
        function animate() {
            currentX += (targetX - currentX) * 0.06;
            currentY += (targetY - currentY) * 0.06;
            var sf = document.getElementById('starfield');
            var wrap = sf ? sf.querySelector('.starfield-stars') : null;
            if (wrap && sf.style.display !== 'none') {
                wrap.style.transform = 'translate(' + currentX + 'px,' + currentY + 'px)';
            }
            requestAnimationFrame(animate);
        }
        animate();
    })();

    (function initCanvas() {
        const c = document.getElementById('bg-canvas');
        const ctx = c.getContext('2d');
        let w, h, particles = [];
        function resize() { w = c.width = window.innerWidth; h = c.height = window.innerHeight; }
        resize(); window.addEventListener('resize', resize);
        for (let i = 0; i < 80; i++) {
            particles.push({ x: Math.random()*w, y: Math.random()*h, r: Math.random()*1.5+0.4,
                vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3, a: Math.random()*0.5+0.2 });
        }
        function draw() {
            ctx.clearRect(0,0,w,h);
            ctx.strokeStyle = 'rgba(61,192,216,0.05)'; ctx.lineWidth = 1;
            const gs = 50;
            for (let x = gs; x < w; x += gs) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
            for (let y = gs; y < h; y += gs) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if (p.x<0||p.x>w) p.vx*=-1; if (p.y<0||p.y>h) p.vy*=-1;
                ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
                ctx.fillStyle = `rgba(94,224,244,${p.a})`; ctx.fill();
            });
            for (let i=0;i<particles.length;i++) {
                for (let j=i+1;j<particles.length;j++) {
                    const dx=particles[i].x-particles[j].x, dy=particles[i].y-particles[j].y;
                    const dist=Math.sqrt(dx*dx+dy*dy);
                    if(dist<100){ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);
                        ctx.lineTo(particles[j].x,particles[j].y);
                        ctx.strokeStyle=`rgba(61,192,216,${0.06*(1-dist/100)})`;ctx.stroke();}
                }
            }
            requestAnimationFrame(draw);
        }
        draw();
    })();

    (function setupMainResizeObserver() {
        var mainEl = document.getElementById('main');
        if (!mainEl) return;
        var ro = new ResizeObserver(function() {
            var sf = document.getElementById('starfield');
            if (!sf) return;
            sf.style.width = mainEl.clientWidth + 'px';
            sf.style.height = mainEl.clientHeight + 'px';
            var hud = sf.querySelector('.starfield-hud');
            if (hud) { void hud.offsetHeight; }
        });
        ro.observe(mainEl);
    })();
    (function initMobile() {
        if (window.innerWidth <= 768) {
            var panel = document.getElementById('era-info-panel');
            if (panel) panel.classList.add('collapsed');
        }
    })();
    buildStarfield();
    history.replaceState({ view: 'stars' }, '', '#stars');
    setupScrollNavigation();

    var contentArea2 = document.getElementById('content-area');
    var entryUnfocusTimer = null;

    contentArea2.addEventListener('mouseover', function(e) {
        var entryStar = e.target.closest('.entry-star');
        if (!entryStar) return;
        if (entryUnfocusTimer) { clearTimeout(entryUnfocusTimer); entryUnfocusTimer = null; }
        var display = entryStar.closest('.era-display');
        if (!display) return;
        display.classList.add('entry-focused');
        display.querySelectorAll('.entry-star').forEach(function(es) { es.classList.remove('entry-focus'); });
        entryStar.classList.add('entry-focus');
    });
    contentArea2.addEventListener('mouseout', function(e) {
        var entryStar = e.target.closest('.entry-star');
        if (!entryStar) return;
        var display = entryStar.closest('.era-display');
        if (!display) return;
        if (entryUnfocusTimer) clearTimeout(entryUnfocusTimer);
        entryUnfocusTimer = setTimeout(function() {
            entryUnfocusTimer = null;
            if (!display.querySelector('.entry-star:hover')) {
                display.classList.remove('entry-focused');
                display.querySelectorAll('.entry-star').forEach(function(es) { es.classList.remove('entry-focus'); });
            }
        }, 80);
    });

    function eraTransitionFlash() {
        var overlay = document.createElement('div');
        overlay.className = 'era-transition-overlay';
        document.getElementById('main').appendChild(overlay);
        setTimeout(function() { if (overlay.parentNode) overlay.remove(); }, 550);
    }

    function openArticleReader(link, title) {
        var existing = document.querySelector('.article-reader-overlay');
        if (existing) existing.remove();

        var overlay = document.createElement('div');
        overlay.className = 'article-reader-overlay';

        var escHandler = function(e) { if (e.key === 'Escape') closeArticleReader(); };
        overlay._escHandler = escHandler;
        document.addEventListener('keydown', escHandler);

        overlay.innerHTML =
            '<div class="article-reader-container">' +
            '<div class="reader-corner tl"></div>' +
            '<div class="reader-corner tr"></div>' +
            '<div class="reader-corner bl"></div>' +
            '<div class="reader-corner br"></div>' +
            '<div class="reader-hud-txt hud-tl">SYS/ONLINE · TERMINAL</div>' +
            '<div class="reader-hud-txt hud-tr">FRAME 0001 · 128hz</div>' +
            '<div class="reader-hud-txt hud-bl">CHAN.01 · SECURE</div>' +
            '<div class="reader-hud-txt hud-br">● LIVE STREAM</div>' +
            '<div class="reader-scanline"></div>' +
            '<div class="reader-particle" style="top:12%;left:4%;animation-delay:0s"></div>' +
            '<div class="reader-particle" style="top:78%;right:5%;animation-delay:2.3s"></div>' +
            '<div class="reader-particle" style="top:45%;right:8%;animation-delay:4.7s"></div>' +
            '<div class="article-reader-header">' +
            '<span class="reader-title">' + (title || '阅读') + '</span>' +
            '<div class="article-reader-close" onclick="closeArticleReader()">✕</div>' +
            '</div>' +
            '<div class="article-reader-body">' +
            '<div class="article-reader-loading"><div class="loading-dot"></div><span>正在加载文章内容...</span></div>' +
            '</div>' +
            '</div>';

        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) closeArticleReader();
        });

        document.getElementById('main').appendChild(overlay);

        var abbrlink = '';
        var match = link.match(/\/posts\/(\d+)\.html/);
        if (match) abbrlink = match[1];

        if (abbrlink) {
            var url = '/menu/posts/' + abbrlink + '.htmlpart';
            fetch(url).then(function(res) {
                if (!res.ok) throw new Error('Not found');
                return res.text();
            }).then(function(html) {
                var body = overlay.querySelector('.article-reader-body');
                if (body) body.innerHTML = html;
            }).catch(function() {
                var body = overlay.querySelector('.article-reader-body');
                if (body) body.innerHTML = '<div class="article-reader-loading"><span>⚠ 无法加载文章内容，请确认已运行 hexo generate 生成菜单文章文件。</span></div>';
            });
        } else {
            var body = overlay.querySelector('.article-reader-body');
            if (body) body.innerHTML = '<div class="article-reader-loading"><span>⚠ 未找到对应的文章链接。</span></div>';
        }
    }

    function closeArticleReader() {
        var overlay = document.querySelector('.article-reader-overlay');
        if (!overlay) return;
        if (overlay._escHandler) {
            document.removeEventListener('keydown', overlay._escHandler);
        }
        overlay.style.animation = 'none';
        overlay.remove();
    }
</script>
