<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第九边缘：木缘桑庭 · 时间线</title>
    <style>
        :root {
            --bg-deep: #020b18;
            --bg-panel: rgba(5, 14, 36, 0.94);
            --bg-card: rgba(8, 20, 44, 0.82);
            --accent: #3dc0d8;
            --accent-glow: #5ee0f4;
            --accent-dim: #1a7088;
            --text-primary: #d4e6f4;
            --text-secondary: #6e98b8;
            --text-dim: #3a6080;
            --border: rgba(61, 192, 216, 0.15);
            --border-bright: rgba(61, 192, 216, 0.45);
            --danger: #e0556a;
            --warning: #c9a050;
            --success: #3cc8a0;
            --info: #3dc0d8;
            --deep-blue: #031428;
            --star-glow: #7ee8ff;
            --lantern: #e69850;
            --lantern-glow: #f4b870;
            --navy: #061428;
            --foam: rgba(126,232,255,0.12);
            --seafoam: #4ad8b0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            display: flex;
            user-select: none;
        }

        #bg-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }

        #app { display: flex; width: 100%; height: 100%; position: relative; z-index: 1; }

        /* ── Starfield Directory ── */
        @keyframes scanVertical {
            0% { top: -2px; opacity: 0; }
            4% { opacity: 0.65; }
            92% { opacity: 0.65; }
            97% { opacity: 0; }
            100% { top: calc(100% + 2px); opacity: 0; }
        }
        @keyframes scanGlow {
            0% { top: 50%; opacity: 0; }
            4% { opacity: 0.7; }
            92% { opacity: 0.7; }
            97% { opacity: 0; }
            100% { top: calc(50% + 100%); opacity: 0; }
        }
        #starfield {
            position: absolute; inset: 0;
            display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
            align-content: center; gap: 0; padding: 60px 40px;
            z-index: 5; pointer-events: none;
        }
        .starfield-stars {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
        }
        #starfield::before {
            content: ''; position: absolute; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent 5%, rgba(61,192,216,0.15) 20%, rgba(94,224,244,0.5) 50%, rgba(61,192,216,0.15) 80%, transparent 95%);
            box-shadow: 0 0 12px rgba(94,224,244,0.35), 0 0 30px rgba(61,192,216,0.15), 0 2px 8px rgba(94,224,244,0.1);
            z-index: 3; pointer-events: none;
            animation: scanVertical 8s ease-in-out infinite;
        }
        #starfield::after {
            content: ''; position: absolute; left: 0; width: 100%; height: 120px;
            background: radial-gradient(ellipse at center, rgba(94,224,244,0.08) 0%, transparent 70%);
            z-index: 3; pointer-events: none;
            opacity: 0; animation: scanGlow 8s ease-in-out infinite;
        }

        /* ── Starfield HUD Overlay ── */
        .starfield-hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 4; pointer-events: none; font-family: "Consolas","Courier New",monospace;
            display: none;
        }
        .starfield-hud.visible { display: block; }
        .starfield-hud.hide-corners .hud-corner,
        .starfield-hud.hide-corners .hud-info { display: none; }
        .starfield-hud .hud-corner {
            position: absolute; width: 28px; height: 28px;
            border-color: rgba(61,192,216,0.35); border-style: solid;
        }
        .starfield-hud .hud-corner.tl { top: 16px; left: 16px; border-width: 1px 0 0 1px; }
        .starfield-hud .hud-corner.tr { top: 16px; right: 16px; border-width: 1px 1px 0 0; }
        .starfield-hud .hud-corner.bl { bottom: 16px; left: 16px; border-width: 0 0 1px 1px; }
        .starfield-hud .hud-corner.br { bottom: 16px; right: 16px; border-width: 0 1px 1px 0; }
        .starfield-hud .hud-info {
            position: absolute; font-size: 10px; letter-spacing: 1.5px;
            color: rgba(94,224,244,0.45); line-height: 1.6;
            text-shadow: 0 0 6px rgba(94,224,244,0.2);
        }
        .starfield-hud .hud-info.tl-info { top: 20px; left: 52px; text-align: left; }
        .starfield-hud .hud-info.tr-info { top: 20px; right: 52px; text-align: right; }
        .starfield-hud .hud-info.bl-info { bottom: 20px; left: 52px; text-align: left; }
        .starfield-hud .hud-info.br-info { bottom: 100px; right: 52px; text-align: right; }
        .starfield-hud .hud-label {
            font-size: 8px; letter-spacing: 2px; color: rgba(61,192,216,0.3);
            text-transform: uppercase; margin-bottom: 2px;
        }
        .starfield-hud .hud-value { color: rgba(94,224,244,0.55); }
        .starfield-hud .hud-scanline {
            position: absolute; left: 0; width: 100%; height: 1px;
            background: rgba(61,192,216,0.06); pointer-events: none;
        }
        .starfield-hud .hud-scanline:nth-child(5) { top: 25%; }
        .starfield-hud .hud-scanline:nth-child(6) { top: 50%; }
        .starfield-hud .hud-scanline:nth-child(7) { top: 75%; }
        .starfield-hud .hud-typing-wrap {
            position: fixed; bottom: 80px; left: calc(50% - 140px); transform: translateX(-50%);
            max-width: 600px; font-family: "Consolas",monospace;
            font-size: 11px; color: rgba(94,224,244,0.5); letter-spacing: 1px;
            opacity: 0.8; text-align: center; line-height: 1.6;
        }
        .starfield-hud .hud-typing-label {
            color: rgba(61,192,216,0.25); font-size: 8px; letter-spacing: 2px;
            margin-right: 10px; text-transform: uppercase;
        }
        .starfield-hud .hud-typing-cursor {
            color: rgba(94,224,244,0.7); animation: cursorBlink 0.8s step-end infinite;
        }
        @keyframes cursorBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .starfield-hud .hud-bars {
            position: absolute; bottom: 20px; right: 52px;
            display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
        }
        .starfield-hud .hud-bar-group {
            display: flex; flex-direction: row; align-items: center; gap: 8px;
        }
        .starfield-hud .hud-bar-label {
            font-size: 7px; letter-spacing: 2px; color: rgba(61,192,216,0.3);
            font-family: "Consolas",monospace; min-width: 24px; text-align: right;
        }
        .starfield-hud .hud-bar-track {
            width: 60px; height: 4px; background: rgba(61,192,216,0.08);
            position: relative; overflow: hidden;
        }
        .starfield-hud .hud-bar-fill {
            position: absolute; top: 0; left: 0; height: 100%;
            background: rgba(94,224,244,0.5); transition: width 0.5s ease;
            box-shadow: 0 0 6px rgba(94,224,244,0.4);
        }
        .starfield-hud .hud-bar-fill.pwr { width: 87%; background: rgba(94,224,244,0.5); }
        .starfield-hud .hud-bar-fill.scn { width: 42%; background: rgba(74,216,176,0.5); box-shadow: 0 0 6px rgba(74,216,176,0.4); }
        .starfield-hud .hud-bar-val {
            font-size: 7px; letter-spacing: 1px; color: rgba(61,192,216,0.35);
            font-family: "Consolas",monospace; width: 28px; text-align: right;
        }
        @keyframes pulseDot {
            0%, 100% { transform: translate(-50%, -50%) scale(0.5); opacity: 0.35; box-shadow: 0 0 3px rgba(94,224,244,0.25); }
            50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; box-shadow: 0 0 10px rgba(94,224,244,0.7), 0 0 22px rgba(94,224,244,0.3); }
        }
        @keyframes pulseRingOut {
            0% { transform: translate(-50%, -50%) scale(0.15); opacity: 0.55; border-color: rgba(94,224,244,0.5); }
            100% { transform: translate(-50%, -50%) scale(2.4); opacity: 0; border-color: rgba(94,224,244,0); }
        }
        .starfield-hud .hud-pulse-track {
            width: 60px; height: 4px; position: relative;
            background: transparent !important; overflow: visible;
        }
        .starfield-hud .hud-pulse-dot {
            width: 5px; height: 5px; border-radius: 50%;
            background: rgba(94,224,244,0.9); position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            animation: pulseDot 1.8s ease-in-out infinite; z-index: 1;
        }
        .starfield-hud .hud-pulse-ring {
            position: absolute; width: 28px; height: 28px; border-radius: 50%;
            border: 1px solid rgba(94,224,244,0.5); top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.15); opacity: 0;
        }
        .starfield-hud .hud-pulse-ring:nth-child(1) { animation: pulseRingOut 1.8s ease-out infinite; }
        .starfield-hud .hud-pulse-ring:nth-child(2) { animation: pulseRingOut 1.8s ease-out 0.9s infinite; }

        .star-point {
            position: absolute; cursor: pointer; pointer-events: auto;
            display: flex; flex-direction: column; align-items: center;
            transition: all 0.5s cubic-bezier(0.25,0.1,0.25,1);
        }
        .star-point .star-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--star-glow);
            box-shadow: 0 0 8px var(--star-glow), 0 0 20px rgba(126,232,255,0.5), 0 0 40px rgba(61,192,216,0.25);
            transition: all 0.4s ease;
        }
        .star-point:hover .star-dot {
            width: 11px; height: 11px;
            box-shadow: 0 0 16px var(--star-glow), 0 0 34px rgba(126,232,255,0.7), 0 0 56px rgba(61,192,216,0.4);
        }
        .star-point .star-line {
            width: 1px; height: 18px; background: linear-gradient(to bottom, rgba(126,232,255,0.45), transparent);
            margin: 3px 0;
        }
        .star-point .star-label {
            font-size: 13px; font-weight: 600; color: var(--text-primary);
            letter-spacing: 2px; white-space: nowrap;
            text-shadow: 0 0 8px rgba(61,192,216,0.3);
            transition: all 0.3s;
        }
        .star-point:hover .star-label { color: var(--accent-glow); text-shadow: 0 0 14px rgba(61,192,216,0.5); }
        .star-point .star-time {
            font-size: 10px; color: var(--text-dim); letter-spacing: 1px;
            font-family: "Consolas", monospace; margin-top: 2px;
        }
        .star-point.branch-star .star-dot { background: var(--warning); box-shadow: 0 0 8px var(--warning), 0 0 20px rgba(201,160,80,0.5); }
        .star-point.branch-star:hover .star-dot { box-shadow: 0 0 16px var(--warning), 0 0 34px rgba(201,160,80,0.7); }
        .star-constellation-line {
            position: absolute; height: 1.5px;
            background: linear-gradient(90deg, transparent, rgba(126,232,255,0.4) 20%, rgba(94,224,244,0.55) 50%, rgba(126,232,255,0.4) 80%, transparent);
            pointer-events: none; z-index: 0;
            transform-origin: left center; opacity: 0.6;
            box-shadow: 0 0 6px rgba(61,192,216,0.2);
        }

        #main {
            flex: 1; height: 100%; display: flex; flex-direction: column;
            overflow: hidden; position: relative; min-width: 0;
        }

        #era-info-panel {
            width: 280px; min-width: 280px; height: 100%;
            background: linear-gradient(180deg, #060f1e 0%, #030c18 100%);
            border-left: 1px solid var(--border);
            display: flex; flex-direction: column;
            overflow: hidden; z-index: 2; transition: all 0.3s;
            position: relative;
            transition: transform 0.42s cubic-bezier(0.4,0,0.2,1), margin-right 0.42s cubic-bezier(0.4,0,0.2,1);
            margin-right: 0; transform: translateX(0);
        }
        #era-info-panel.collapsed {
            transform: translateX(280px);
            margin-right: -280px;
        }
        #era-info-panel::before {
            content: ''; position: absolute; top: 0; left: 0; width: 1px; height: 100%;
            background: linear-gradient(180deg, transparent, rgba(61,192,216,0.3) 15%, rgba(61,192,216,0.08) 50%, rgba(61,192,216,0.3) 85%, transparent);
            z-index: 0; pointer-events: none;
        }
        #era-info-panel::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
        }
        #era-info-panel .panel-header {
            padding: 18px 16px 12px; border-bottom: 1px solid var(--border);
            flex-shrink: 0; position: relative; z-index: 11;
            display: flex; align-items: flex-start; justify-content: space-between;
        }
        #era-info-panel .panel-header .panel-header-left { flex: 1; }
        #panel-collapse-btn {
            width: 28px; height: 28px; flex-shrink: 0;
            border: 1px solid var(--border); background: rgba(10,22,48,0.6);
            color: var(--accent-dim); font-size: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            clip-path: polygon(3px 0,100% 0,100% calc(100% - 3px),calc(100% - 3px) 100%,0 100%,0 3px);
            transition: all 0.3s; margin-left: 8px;
        }
        #panel-collapse-btn:hover { border-color: var(--accent); color: var(--accent-glow); background: rgba(61,192,216,0.1); }
        #panel-collapse-btn .collapse-arrow { transition: transform 0.35s ease; display: inline-block; }
        #panel-collapse-btn.collapsed .collapse-arrow { transform: rotate(180deg); }
        #panel-expand-tab {
            display: none; position: fixed; right: 0; top: 50%; transform: translateY(-50%);
            width: 22px; height: 64px; z-index: 20; cursor: pointer;
            border: 1px solid var(--border); border-right: none;
            background: linear-gradient(180deg, rgba(6,15,30,0.92) 0%, rgba(3,12,24,0.92) 100%);
            color: var(--accent-dim); font-size: 11px;
            align-items: center; justify-content: center;
            clip-path: polygon(0 6px,100% 0,100% 100%,0 calc(100% - 6px));
            transition: all 0.3s;
        }
        #panel-expand-tab.visible { display: flex; }
        #panel-expand-tab:hover { color: var(--accent-glow); border-color: var(--accent); }
        #panel-expand-tab .expand-arrow { transition: transform 0.35s ease; }
        #era-info-panel .panel-header .panel-sys-label {
            font-size: 10px; font-weight: 700; color: var(--accent-dim);
            letter-spacing: 3px; text-transform: uppercase; margin-bottom: 6px;
            display: flex; align-items: center; gap: 8px;
        }
        #era-info-panel .panel-header .panel-rec-dot {
            display: inline-block; width: 8px; height: 8px; border-radius: 50%;
            background: #3cc8a0; box-shadow: 0 0 8px #3cc8a0;
            animation: recPulse 1.6s ease-in-out infinite;
        }
        @keyframes recPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        #era-info-panel .panel-header .panel-era-name {
            font-size: 16px; font-weight: 800; color: var(--text-primary);
            margin-bottom: 2px; position: relative; z-index: 11;
        }
        #era-info-panel .panel-header .panel-era-time {
            font-size: 10px; color: var(--accent-dim); letter-spacing: 1px;
            font-family: "Consolas", "Courier New", monospace; position: relative; z-index: 11;
        }
        #era-info-panel .panel-body {
            flex: 1; overflow-y: auto; padding: 14px; position: relative; z-index: 11;
            scrollbar-width: thin; scrollbar-color: var(--accent-dim) transparent;
        }
        #era-info-panel .panel-body::-webkit-scrollbar { width: 4px; }
        #era-info-panel .panel-body::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 2px; }
        #era-info-panel .panel-summary {
            font-size: 13px; color: var(--text-primary); line-height: 1.8;
            padding: 14px 16px; margin-bottom: 10px;
            background: linear-gradient(180deg, rgba(61,192,216,0.05) 0%, rgba(61,192,216,0.02) 100%);
            border: 1px solid rgba(61,192,216,0.1);
            font-family: "Consolas", "Courier New", "Microsoft YaHei", monospace;
            letter-spacing: 0.5px; position: relative;
            clip-path: polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px);
        }
        #era-info-panel .panel-summary::before {
            content: '// SUMMARY'; display: block; font-size: 9px;
            color: var(--accent-dim); letter-spacing: 2px; margin-bottom: 6px;
            font-family: "Consolas", monospace;
        }
        #era-info-panel .panel-detail-toggle {
            font-size: 10px; color: var(--accent-dim); cursor: pointer;
            letter-spacing: 2px; padding: 8px 0; text-align: center;
            transition: color 0.3s; border-top: 1px solid var(--border);
            margin-top: 6px; user-select: none;
            border-bottom: 1px solid transparent; transition: all 0.3s;
        }
        #era-info-panel .panel-detail-toggle:hover { color: var(--accent-glow); border-bottom-color: var(--border); }
        #era-info-panel .panel-detail-toggle::after {
            content: ' ▾'; font-size: 10px;
        }
        #era-info-panel .panel-detail-toggle.expanded::after {
            content: ' ▴';
        }
        #era-info-panel .panel-desc-line {
            font-size: 12px; color: var(--text-secondary); line-height: 1.7;
            margin-bottom: 2px; padding: 8px 12px;
            border-left: 2px solid rgba(61,192,216,0.15);
            border-bottom: 1px solid rgba(61,192,216,0.06);
            background: linear-gradient(180deg, rgba(61,192,216,0.04) 0%, rgba(61,192,216,0.01) 100%);
            transition: all 0.2s; font-family: "Consolas", "Courier New", "Microsoft YaHei", monospace;
            clip-path: polygon(0 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 0);
        }
        #era-info-panel .panel-desc-line::before {
            content: '> '; color: var(--accent-dim); font-family: "Consolas", monospace; font-size: 10px;
        }
        #era-info-panel .panel-desc-line:hover {
            border-left-color: var(--accent-dim);
            background: rgba(61,192,216,0.06);
        }
        #era-info-panel .panel-detail-list {
            display: none; margin-top: 4px;
        }
        #era-info-panel .panel-detail-list.visible { display: block; }
        #era-info-panel .panel-default-hint {
            font-size: 12px; color: var(--text-dim); text-align: center;
            padding: 30px 10px; letter-spacing: 1px; font-family: "Consolas", "Courier New", monospace;
        }

        #content-area {
            flex: 1; overflow-y: auto; padding: 48px 32px;
            display: flex; flex-direction: column; align-items: center;
            justify-content: safe center;
            scrollbar-width: thin; scrollbar-color: var(--accent-dim) transparent;
        }
        #content-area::-webkit-scrollbar { width: 5px; }
        #content-area::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 3px; }

        .era-display {
            width: 100%; max-width: 720px; margin: 0 auto;
        }

        .era-header {
            text-align: center; margin: 0 auto 6px;
            animation: eraFadeIn 0.6s ease;
        }
        @keyframes eraFadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
        @keyframes starAppear { from{opacity:0;transform:scale(0.3) translateY(10px)} to{opacity:1;transform:scale(1) translateY(0)} }
        .era-badge {
            display: inline-block; padding: 5px 16px;
            font-size: 10px; letter-spacing: 3px; font-weight: 700;
            border: 1px solid var(--border-bright); color: var(--accent-glow);
            margin-bottom: 10px; background: rgba(61,192,216,0.06);
            clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
        }
        .era-badge.branch-badge { border-color: var(--lantern); color: var(--lantern-glow); background: rgba(230,152,80,0.06); }
        .era-title {
            font-size: 36px; font-weight: 800; letter-spacing: 4px;
            background: linear-gradient(135deg, #b8e8ff, #3dc0d8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin-bottom: 8px; line-height: 1.3;
        }
        .era-time-large {
            font-size: 13px; color: var(--accent-glow); letter-spacing: 3px;
            font-family: "Consolas", "Courier New", monospace;
            opacity: 0.7;
        }
        .era-desc { display: flex; flex-direction: column; gap: 6px; align-items: center; margin-top: 12px; }
        .era-desc-line { font-size: 14px; color: var(--text-secondary); max-width: 500px; text-align: center; line-height: 1.7; }
        .era-desc-center { margin: 2px auto 0; max-width: 560px; text-align: center; }
        .era-desc-center .desc-center-line {
            font-size: 13px; color: var(--text-secondary); line-height: 1.9;
            padding: 1px 0; font-family: "Consolas","Microsoft YaHei",monospace;
            letter-spacing: 0.5px;
        }
        .era-desc-center .desc-center-line::before { content: '> '; color: var(--accent-dim); }

        /* ── View Era Button ── */
        .view-era-btn {
            display: inline-block; margin-top: 24px; padding: 15px 46px;
            font-size: 14px; font-weight: 700; cursor: pointer;
            letter-spacing: 3px; background: transparent;
            color: var(--accent-glow); border: 1px solid var(--accent);
            transition: all 0.35s; position: relative;
            clip-path: polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
        }
        .view-era-btn::after {
            content: ''; position: absolute; inset: 0; background: var(--foam);
            clip-path: inherit; transition: all 0.35s;
        }
        .view-era-btn:hover { color: #fff; border-color: var(--accent-glow); transform: translateY(-2px); }
        .view-era-btn:hover::after { background: rgba(61,192,216,0.2); box-shadow: 0 0 36px rgba(61,192,216,0.3); }

        #nav-area {
            width: 100%; max-width: 720px; margin: 0 auto;
            display: flex; flex-direction: column; align-items: center;
            gap: 14px; margin-top: 40px; padding-bottom: 60px;
            animation: eraFadeIn 0.5s ease 0.2s both;
        }
        .nav-section-label {
            font-size: 11px; color: var(--text-dim); letter-spacing: 3px;
            text-align: center; margin-bottom: 4px; text-transform: uppercase;
            font-family: "Consolas", monospace;
        }
        .nav-buttons { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }

        .nav-btn {
            padding: 15px 30px; font-size: 14px; font-weight: 600;
            cursor: pointer; border: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(8,20,44,0.7) 0%, rgba(4,14,32,0.7) 100%);
            color: var(--text-primary);
            transition: all 0.3s; letter-spacing: 2px; text-align: center;
            min-width: 160px; position: relative;
            clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
        }
        .nav-btn::after {
            content: ''; position: absolute; top: 1px; left: 10%; right: 10%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(61,192,216,0.15), transparent);
            pointer-events: none;
        }
        .nav-btn:hover { border-color: var(--border-bright); transform: translateY(-2px); box-shadow: 0 0 28px rgba(61,192,216,0.18); }
        .nav-btn.main-path { border-color: var(--accent); background: linear-gradient(180deg, rgba(61,192,216,0.08) 0%, rgba(61,192,216,0.03) 100%); }
        .nav-btn.main-path:hover { background: linear-gradient(180deg, rgba(61,192,216,0.14) 0%, rgba(61,192,216,0.06) 100%); box-shadow: 0 0 32px rgba(61,192,216,0.28); }
        .nav-btn.alt-path { border-color: var(--warning); }
        .nav-btn.alt-path:hover { box-shadow: 0 0 28px rgba(201,160,80,0.22); }
        .nav-btn .btn-era-name { display: block; font-size: 15px; margin-bottom: 2px; }
        .nav-btn .btn-era-time { display: block; font-size: 10px; color: var(--text-dim); letter-spacing: 2px; font-family: "Consolas",monospace; }
        .nav-btn .btn-outcome { display: block; font-size: 10px; margin-top: 4px; color: var(--lantern); }

        /* ── Branch Options ── */
        .branch-options { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-top: 24px; }
        .branch-option {
            flex: 1 1 240px; max-width: 380px; min-width: 200px;
            background: linear-gradient(180deg, rgba(8,20,44,0.7) 0%, rgba(3,10,24,0.7) 100%);
            border: 1px solid var(--border);
            padding: 26px 24px; cursor: pointer;
            transition: all 0.35s; position: relative;
            clip-path: polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
        }
        .branch-option::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(61,192,216,0.2), transparent);
        }
        .branch-option::after {
            content: ''; position: absolute; inset: 0; background: transparent;
            clip-path: inherit; transition: all 0.35s;
        }
        .branch-option:hover { border-color: var(--border-bright); transform: translateY(-3px); box-shadow: 0 8px 32px rgba(61,192,216,0.12); }
        .branch-option:hover::after { background: rgba(61,192,216,0.04); }
        .branch-option.selected {
            border-color: var(--accent);
            box-shadow: 0 0 32px rgba(61,192,216,0.2);
            background: linear-gradient(180deg, rgba(61,192,216,0.1) 0%, rgba(61,192,216,0.04) 100%);
        }
        .branch-option .branch-label {
            font-size: 11px; font-weight: 700; letter-spacing: 3px;
            padding: 4px 12px; display: inline-block; margin-bottom: 12px;
            clip-path: polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px);
        }
        .branch-option .branch-label.label-main { background: rgba(61,192,216,0.18); color: var(--accent-glow); }
        .branch-option .branch-label.label-alt { background: rgba(212,168,75,0.18); color: var(--warning); }
        .branch-option .branch-article-name { font-size: 17px; font-weight: 700; color: var(--text-primary); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .branch-option .branch-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.8; font-family: "Consolas","Microsoft YaHei",monospace; }
        .branch-option .branch-desc-line { margin-bottom: 3px; }
        .branch-option .branch-outcome-tag { margin-top: 12px; font-size: 10px; letter-spacing: 2px; color: var(--lantern); font-weight: 600; }
        .branch-option .branch-click-hint { margin-top: 14px; font-size: 11px; color: var(--accent-dim); letter-spacing: 2px; text-align: right; }
        .branch-option-hint { text-align: center; padding: 30px 20px !important; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 140px; }
        .branch-hint-text { font-size: 20px; font-weight: 700; color: var(--text-primary); letter-spacing: 2px; margin: 8px 0 12px; line-height: 1.5; font-style: italic; }
        .branch-option-hint .branch-click-hint { text-align: center; margin-top: 6px; }
        .branch-detail-area { width: 100%; margin-top: 24px; animation: eraFadeIn 0.4s ease; }

        /* ── Entry Constellation (replaces card stage) ── */
        .entry-constellation {
            display: flex; flex-wrap: wrap; gap: 28px;
            justify-content: center; align-items: flex-start;
            margin: 20px 0 10px; padding: 8px 0 6px; position: relative;
        }
        .entry-star {
            display: flex; flex-direction: column; align-items: center;
            cursor: pointer; transition: all 0.35s ease;
            padding: 6px 6px; min-width: 60px; position: relative; z-index: 1;
        }
        .entry-star:nth-child(odd) { margin-top: 0; }
        .entry-star:nth-child(even) { margin-top: 26px; }
        .entry-star .es-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--star-glow);
            box-shadow: 0 0 10px var(--star-glow), 0 0 22px rgba(126,232,255,0.4);
            transition: all 0.3s;
        }
        .entry-star:hover .es-dot {
            box-shadow: 0 0 16px var(--star-glow), 0 0 32px rgba(126,232,255,0.6);
            transform: scale(1.5);
        }
        .entry-star .es-line {
            width: 1px; height: 10px; background: linear-gradient(to bottom, rgba(126,232,255,0.35), transparent);
            margin: 3px 0;
        }
        .entry-star .es-label {
            font-size: 14px; font-weight: 700; color: var(--text-primary); letter-spacing: 1px;
            text-align: center; line-height: 1.3; max-width: 80px;
            transition: color 0.3s;
        }
        .entry-star:hover .es-label { color: var(--accent-glow); }
        .entry-star .es-type {
            font-size: 7px; color: var(--text-dim); letter-spacing: 2px; text-transform: uppercase;
            margin-top: 3px; font-family: "Consolas",monospace;
            font-weight: 400;
        }
        .entry-star.es-line-type .es-dot { background: var(--info); box-shadow: 0 0 10px rgba(61,192,216,0.7); }
        .entry-star.es-plan-type .es-dot { background: var(--accent-glow); box-shadow: 0 0 10px rgba(94,224,244,0.7); }
        .entry-star.es-bg-type .es-dot { background: var(--success); box-shadow: 0 0 10px rgba(60,200,160,0.7); }
        .entry-star.es-theory-type .es-dot { background: var(--warning); box-shadow: 0 0 10px rgba(212,168,75,0.7); }
        .entry-star.es-thought-type .es-dot { background: #b890e8; box-shadow: 0 0 10px rgba(184,144,232,0.7); }
        .entry-star.es-if-type .es-dot { background: var(--danger); box-shadow: 0 0 10px rgba(224,85,106,0.7); }

        .entry-zigzag-line {
            position: absolute; height: 1.5px; pointer-events: none; z-index: 0;
            background: linear-gradient(90deg, rgba(61,192,216,0.1), rgba(126,232,255,0.45), rgba(61,192,216,0.1));
            transform-origin: left center; opacity: 0.65;
            box-shadow: 0 0 3px rgba(61,192,216,0.15);
        }

        /* ── Article Document Panel ── */
        .article-doc-panel {
            margin: 0 auto; width: 100%; max-width: 680px;
            border: 1px solid var(--border-bright);
            background: linear-gradient(180deg, rgba(4,22,40,0.98) 0%, rgba(2,10,24,0.98) 100%);
            overflow: hidden; max-height: 0; opacity: 0; position: relative;
            transition: max-height 0.45s cubic-bezier(0.4,0,0.2,1), opacity 0.35s ease, margin 0.4s ease;
            clip-path: polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
        }
        .article-doc-panel::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
            z-index: 1; opacity: 0.7;
        }
        .article-doc-panel.open { max-height: 780px; opacity: 1; margin: 20px auto 0; }
        .article-doc-panel .doc-header {
            padding: 16px 24px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            background: linear-gradient(180deg, rgba(61,192,216,0.06) 0%, rgba(61,192,216,0.02) 100%);
            position: relative;
        }
        .article-doc-panel .doc-header .doc-type-tag {
            font-size: 10px; letter-spacing: 2px; padding: 4px 12px; font-weight: 600; flex-shrink: 0;
            clip-path: polygon(3px 0,100% 0,100% calc(100% - 3px),calc(100% - 3px) 100%,0 100%,0 3px);
            font-family: "Consolas",monospace;
        }
        .doc-type-tag.tag-line { background: rgba(61,192,216,0.18); color: var(--info); }
        .doc-type-tag.tag-plan { background: rgba(61,192,216,0.22); color: var(--accent-glow); }
        .doc-type-tag.tag-background { background: rgba(60,200,160,0.18); color: var(--success); }
        .doc-type-tag.tag-theory { background: rgba(212,168,75,0.18); color: var(--warning); }
        .doc-type-tag.tag-thought { background: rgba(160,120,212,0.18); color: #b890e8; }
        .doc-type-tag.tag-ifline { background: rgba(224,85,106,0.18); color: var(--danger); }
        .article-doc-panel .doc-header .doc-title {
            font-size: 16px; font-weight: 700; color: var(--text-primary); letter-spacing: 1px;
            margin: 0 16px; flex: 1; text-align: center;
        }
        .article-doc-panel .doc-close {
            width: 30px; height: 30px; border: 1px solid var(--border);
            background: rgba(10,22,48,0.6); color: var(--text-dim);
            font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            clip-path: polygon(3px 0,100% 0,100% calc(100% - 3px),calc(100% - 3px) 100%,0 100%,0 3px);
            transition: all 0.2s; flex-shrink: 0;
        }
        .article-doc-panel .doc-close:hover { border-color: var(--accent); color: var(--accent-glow); background: rgba(61,192,216,0.1); }
        .article-doc-panel .doc-body {
            padding: 20px 24px; max-height: 420px; overflow-y: auto;
            scrollbar-width: thin; scrollbar-color: var(--accent-dim) transparent;
        }
        .article-doc-panel .doc-body::-webkit-scrollbar { width: 4px; }
        .article-doc-panel .doc-body::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 2px; }
        .article-doc-panel .doc-section {
            margin-bottom: 16px; padding: 12px 16px;
            background: rgba(61,192,216,0.03); border: 1px solid rgba(61,192,216,0.08);
            position: relative;
            clip-path: polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
        }
        .article-doc-panel .doc-section h5 {
            font-size: 11px; font-weight: 700; color: var(--accent-glow);
            letter-spacing: 2px; margin-bottom: 6px; font-family: "Consolas",monospace;
        }
        .article-doc-panel .doc-section h5::before { content: '> '; }
        .article-doc-panel .doc-section p, .article-doc-panel .doc-section div {
            font-size: 13px; color: var(--text-secondary); line-height: 1.8;
        }
        .article-doc-panel .doc-meta {
            margin-top: 16px; padding: 14px 16px;
            font-size: 11px; color: var(--text-dim); line-height: 1.7;
            font-family: "Consolas","Microsoft YaHei",monospace;
            background: rgba(61,192,216,0.03); border: 1px solid rgba(61,192,216,0.06);
            clip-path: polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
        }
        .article-doc-panel .doc-link {
            margin-top: 12px; padding: 10px 16px;
            font-size: 12px; border: 1px solid rgba(61,192,216,0.1);
            clip-path: polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
        }
        .article-doc-panel .doc-link a { color: var(--accent-glow); text-decoration: none; word-break: break-all; }
        .article-doc-panel .doc-link a:hover { text-decoration: underline; }

        /* ── Ending Screen ── */
        .ending-screen {
            width: 100%; max-width: 600px; margin: 0 auto;
            text-align: center; padding: 60px 20px;
            animation: eraFadeIn 0.6s ease;
        }
        .ending-screen .ending-icon { font-size: 52px; margin-bottom: 22px; filter: drop-shadow(0 0 16px rgba(94,224,244,0.3)); }
        .ending-screen .ending-title {
            font-size: 26px; font-weight: 800; color: var(--accent-glow);
            margin-bottom: 10px; letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(94,224,244,0.2);
        }
        .ending-screen .ending-sub {
            font-size: 13px; color: var(--text-secondary); margin-bottom: 30px; line-height: 1.9;
            font-family: "Consolas","Microsoft YaHei",monospace; opacity: 0.8;
        }
        .ending-screen .ending-line-name {
            font-size: 11px; color: var(--lantern); letter-spacing: 3px; margin-bottom: 8px;
            font-family: "Consolas",monospace; text-shadow: 0 0 10px rgba(230,152,80,0.2);
        }
        .restart-btn {
            display: inline-block; padding: 15px 46px;
            font-size: 14px; font-weight: 700; cursor: pointer; letter-spacing: 3px;
            background: transparent; color: var(--accent-glow);
            border: 1px solid var(--accent); transition: all 0.35s;
            clip-path: polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
        }
        .restart-btn:hover { color: #fff; border-color: var(--accent-glow); box-shadow: 0 0 36px rgba(61,192,216,0.35); background: linear-gradient(180deg, rgba(61,192,216,0.1) 0%, rgba(61,192,216,0.04) 100%); }

        /* ── Mystery Button ── */
        @keyframes lanternPulse {
            0%, 100% { box-shadow: 0 0 18px rgba(230,152,80,0.25), 0 0 40px rgba(230,152,80,0.08); }
            50% { box-shadow: 0 0 28px rgba(230,152,80,0.45), 0 0 60px rgba(230,152,80,0.16); }
        }
        @keyframes lanternFlicker {
            0%, 100% { opacity: 0.85; }
            48% { opacity: 1; }
            50% { opacity: 0.7; }
            52% { opacity: 1; }
        }
        .mystery-btn {
            border-color: var(--lantern) !important;
            background: linear-gradient(180deg, rgba(230,152,80,0.06) 0%, rgba(180,100,40,0.03) 100%) !important;
            min-width: 240px; overflow: hidden;
            animation: lanternPulse 2.8s ease-in-out infinite;
            display: inline-flex !important; align-items: center !important; justify-content: center !important;
        }
        .mystery-btn::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, var(--lantern-glow), transparent);
            animation: lanternFlicker 3s ease-in-out infinite;
        }
        .mystery-btn:hover {
            border-color: var(--lantern-glow) !important;
            box-shadow: 0 0 44px rgba(230,152,80,0.45), 0 0 80px rgba(230,152,80,0.15), inset 0 0 40px rgba(230,152,80,0.04) !important;
            background: linear-gradient(180deg, rgba(230,152,80,0.12) 0%, rgba(180,100,40,0.06) 100%) !important;
            animation: none;
        }
        .mystery-text {
            display: block; font-size: 34px; font-weight: 800; letter-spacing: 10px; text-align: center;
            background: linear-gradient(135deg, var(--lantern-glow), var(--lantern), #d08040);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none; position: relative; z-index: 1;
        }
        .mystery-btn:hover .mystery-text {
            filter: brightness(1.2);
        }

        /* ── Return to Stars Button ── */
        #return-stars-btn {
            display: none; position: fixed; top: 20px; right: 300px;
            z-index: 50; width: 48px; height: 48px;
            background: rgba(6,16,38,0.85); border: 1px solid var(--border);
            color: var(--accent-glow); font-size: 18px; cursor: pointer;
            align-items: center; justify-content: center; flex-direction: column;
            backdrop-filter: blur(8px); transition: all 0.3s;
            clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
        }
        #return-stars-btn.visible { display: flex; }
        #return-stars-btn span { font-size: 10px; letter-spacing: 2px; }
        #return-stars-btn:hover { border-color: var(--accent); box-shadow: 0 0 20px rgba(61,192,216,0.25); }

        .starfield-ctrls {
            display: none; position: fixed; bottom: 28px; left: calc(50% - 140px);
            transform: translateX(-50%); z-index: 50; gap: 12px; align-items: center;
        }
        .starfield-ctrls.visible { display: flex; }
        .ctrl-btn {
            padding: 10px 20px; min-width: 120px; text-align: center;
            background: linear-gradient(180deg, rgba(10,22,48,0.92) 0%, rgba(5,14,32,0.96) 100%);
            border: 1px solid var(--border);
            color: var(--accent-dim); font-size: 11px; cursor: pointer;
            letter-spacing: 3px; font-family: "Consolas",monospace;
            backdrop-filter: blur(8px); transition: all 0.3s;
            clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
            text-transform: uppercase; position: relative; white-space: nowrap;
        }
        .ctrl-btn::before {
            content: ''; position: absolute; top: 6px; left: 10px;
            width: 4px; height: 4px; border-radius: 50%;
            background: var(--seafoam); box-shadow: 0 0 6px var(--seafoam);
            transition: background 0.3s, box-shadow 0.3s;
        }
        .ctrl-btn:hover {
            border-color: var(--accent); color: var(--accent-glow);
            box-shadow: 0 0 20px rgba(61,192,216,0.25), inset 0 0 15px rgba(61,192,216,0.05);
        }
        .ctrl-btn:hover::before { background: var(--accent-glow); box-shadow: 0 0 10px var(--accent-glow); }

        .starfield-list {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 6; flex-direction: column; align-items: center; justify-content: center;
            padding: 60px 80px; gap: 6px; pointer-events: auto;
        }
        .starfield-list.active { display: flex; }
        .starfield-list .sl-entry {
            display: flex; align-items: center; gap: 16px;
            width: 100%; max-width: 520px; padding: 12px 22px;
            cursor: pointer; transition: all 0.3s ease;
            border: 1px solid transparent;
            border-bottom: 1px solid rgba(61,192,216,0.08);
            animation: eraFadeIn 0.5s ease both;
            position: relative;
        }
        .starfield-list .sl-entry:hover {
            background: rgba(61,192,216,0.06);
            border-color: var(--border);
            clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
        }
        .starfield-list .sl-entry:hover .sl-index { color: var(--accent-glow); }
        .starfield-list .sl-index {
            font-size: 11px; font-weight: 700; color: var(--accent-dim);
            font-family: "Consolas",monospace; min-width: 32px; text-align: right;
            letter-spacing: 1px; transition: color 0.3s;
        }
        .starfield-list .sl-marker {
            width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
            background: var(--star-glow); box-shadow: 0 0 6px var(--star-glow);
        }
        .starfield-list .sl-entry.branch-marker .sl-marker { background: var(--warning); box-shadow: 0 0 6px var(--warning); }
        .starfield-list .sl-name {
            font-size: 14px; font-weight: 600; color: var(--text-primary);
            letter-spacing: 2px; flex: 1;
        }
        .starfield-list .sl-time {
            font-size: 10px; color: var(--text-dim); font-family: "Consolas",monospace;
            letter-spacing: 1px;
        }

        /* ── Panel Collapse ── */
        #era-info-panel.collapsed { width: 0; min-width: 0; border-left: none; overflow: hidden; }
        #era-info-panel.collapsed .panel-header, #era-info-panel.collapsed .panel-body { display: none; }

        /* ── Article Modal (Tech) ── */
        .article-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2,6,16,0.85); z-index: 200;
            display: flex; align-items: center; justify-content: center;
            animation: fadeIn 0.2s ease; backdrop-filter: blur(6px);
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .article-modal {
            background: var(--deep-blue); border: 1px solid var(--border-bright);
            width: 90%; max-width: 640px; max-height: 84vh;
            overflow-y: auto; padding: 30px 34px; position: relative;
            animation: modalSlide 0.35s ease;
            scrollbar-width: thin; scrollbar-color: var(--accent-dim) transparent;
            clip-path: polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
        }
        @keyframes modalSlide { from { opacity:0; transform:translateY(16px) scale(0.96); } to { opacity:1; transform:translateY(0) scale(1); } }
        .article-modal::-webkit-scrollbar { width: 4px; }
        .article-modal::-webkit-scrollbar-thumb { background: var(--accent-dim); }
        .article-modal::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
        }
        .article-modal .modal-close {
            position: absolute; top: 14px; right: 18px;
            width: 32px; height: 32px; border: 1px solid var(--border);
            background: rgba(10,22,48,0.8); color: var(--text-secondary);
            font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
            clip-path: polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px);
        }

    function updateInfoPanel(eraId) {
        const era = getEra(eraId);
        if (!era) return;
        const header = document.querySelector('#era-info-panel .panel-header');
        header.querySelector('.panel-sys-label').innerHTML = '<span class="panel-rec-dot"></span> SYSTEM NOTE';
        header.querySelector('.panel-era-name').textContent = era.name;
        header.querySelector('.panel-era-time').textContent = era.time;
        panelBody.innerHTML = '<div class="panel-default-hint">✦ 点击「查看时代」以展开详情</div>';
    }

    function clearInfoPanel() {
        const header = document.querySelector('#era-info-panel .panel-header');
        if (header) {
            header.querySelector('.panel-sys-label').innerHTML = '<span class="panel-rec-dot"></span> SYSTEM NOTE';
            header.querySelector('.panel-era-name').textContent = '——';
            header.querySelector('.panel-era-time').textContent = '——';
        }
        panelBody.innerHTML = '<div class="panel-summary" style="opacity:0.4">选择一颗星以查看时代详情</div>';
    }

    function toggleInfoPanel() {
        var panel = document.getElementById('era-info-panel');
        var expandTab = document.getElementById('panel-expand-tab');
        var collapseBtn = document.getElementById('panel-collapse-btn');
        if (!panel) return;
        var isCollapsed = panel.classList.contains('collapsed');
        var hud = document.querySelector('.starfield-hud');
        if (isCollapsed) {
            panel.classList.remove('collapsed');
            if (expandTab) expandTab.classList.remove('visible');
            if (collapseBtn) collapseBtn.classList.remove('collapsed');
            if (hud) hud.classList.remove('hide-corners');
            var backdrop = document.getElementById('mobile-panel-backdrop');
            if (backdrop) backdrop.classList.remove('visible');
        } else {
            panel.classList.add('collapsed');
            if (expandTab) expandTab.classList.add('visible');
            if (collapseBtn) collapseBtn.classList.add('collapsed');
            if (hud) hud.classList.add('hide-corners');
            var backdrop = document.getElementById('mobile-panel-backdrop');
            if (backdrop) backdrop.classList.add('visible');
        }
    }

    function toggleMobilePanel() {
        var panel = document.getElementById('era-info-panel');
        if (!panel) return;
        toggleInfoPanel();
    }

    function togglePanelDetail() {
        const toggle = document.querySelector('.panel-detail-toggle');
        const list = document.getElementById('panel-detail-list');
        if (!toggle || !list) return;
        const isVisible = list.classList.contains('visible');
        if (isVisible) {
            list.classList.remove('visible');
            toggle.classList.remove('expanded');
            toggle.textContent = '展开详情';
        } else {
            list.classList.add('visible');
            toggle.classList.add('expanded');
            toggle.textContent = '收起详情';
        }
    }

        header.querySelector('.panel-sys-label').innerHTML = '<span class="panel-rec-dot"></span> BRANCH LOG';
        header.querySelector('.panel-era-name').textContent = branch.label + '：' + (branch.article ? branch.article.name : '');
        header.querySelector('.panel-era-time').textContent = era.time;

        let detailLines = '';
        if (branch.desc && branch.desc.length > 0) {
            detailLines = branch.desc.filter(function(d) { return d.indexOf('【结局】') === -1 && d.indexOf('【内容】') === -1; }).map(function(d) { return '<div class="panel-desc-line">' + d + '</div>'; }).join('');
        }

        panelBody.innerHTML = `
    <div class="panel-summary">${branch.hint || '选择了一个发展方向……'}</div>
    <div class="panel-detail-toggle expanded" onclick="togglePanelDetail()">收起详情</div>
    <div class="panel-detail-list visible" id="panel-detail-list">${detailLines}</div>`;

    function navigateTo(eraId) {

        eraExpanded = false;

    function renderEra(eraId) {
        const era = getEra(eraId);
        if (!era) return;
        let html = '<div class="era-display">';
        html += '<div class="era-header">';
        html += `<div class="era-badge${era.type==='branch'?' branch-badge':''}">${era.type==='branch'?'◈ 抉择点':'◆ 时代节点'}</div>`;
        html += `<div class="era-title">${era.name}</div>`;
        html += `<div class="era-time-large">${era.time}</div>`;
        html += '</div>';

        if (era.type === 'normal') {
            html += '<div class="expand-hint"><span class="view-era-btn" onclick="expandCurrentEra()">✦ 查看时代</span></div>';
        } else if (era.type === 'branch') {
            html += '<div class="branch-options">';
            era.branches.forEach((b, i) => {
                const hasOutcome = b.outcome !== null;
                const labelClass = hasOutcome ? 'label-alt' : 'label-main';
                html += `<div class="branch-option branch-option-hint" data-branch-idx="${i}" onclick="selectBranchOption(${era.id}, ${i})">`;
                html += `<div class="branch-label ${labelClass}">${b.label}</div>`;
                html += `<div class="branch-hint-text">${b.hint || '……'}</div>`;
                html += '<div class="branch-click-hint">选择发展 ▸</div>';

            });
            html += '</div>';
            html += '<div id="branch-detail-container"></div>';

        html += '</div>';

    const cardColorMap = { PLANING:'tag-plan', WORLD_PLANING:'tag-plan',
        BACKGROUND:'tag-background', WORLD_BACKGROUND:'tag-background',
        THEORY:'tag-theory', WORLD_THEORY:'tag-theory',
        THOUGHTS_COLLIDE:'tag-thought', LINE:'tag-line', WORLD_LINE:'tag-line', IF_LINE:'tag-ifline' };

    const esTypeClassMap = { LINE:'es-line-type', WORLD_LINE:'es-line-type',
        PLANING:'es-plan-type', WORLD_PLANING:'es-plan-type',
        BACKGROUND:'es-bg-type', WORLD_BACKGROUND:'es-bg-type',
        THEORY:'es-theory-type', WORLD_THEORY:'es-theory-type',
        THOUGHTS_COLLIDE:'es-thought-type', IF_LINE:'es-if-type' };

    function expandCurrentEra() {
        eraExpanded = true;
        const era = getEra(currentEraId);
        if (!era) return;
        if (era.type !== 'normal' || !era.articles) return;

        updateInfoPanel(currentEraId);

        var summary = era.summary || '';
        var detailLines = '';
        if (era.desc && era.desc.length > 0) {
            detailLines = era.desc.filter(function(d) { return d.indexOf('【结局】') === -1 && d.indexOf('【内容】') === -1; }).map(function(d) { return '<div class="panel-desc-line">' + d + '</div>'; }).join('');
        }
        panelBody.innerHTML = '<div class="panel-summary">' + summary + '</div>'
            + (detailLines ? '<div class="panel-detail-toggle expanded" onclick="togglePanelDetail()">收起详情</div><div class="panel-detail-list visible" id="panel-detail-list">' + detailLines + '</div>' : '');

        var html = '';

        html += '<div class="entry-constellation" id="entry-constellation">';
        era.articles.forEach(function(art, i) {
            var t = art.type;
            var esClass = esTypeClassMap[t] || '';
            html += '<div class="entry-star ' + esClass + '" data-idx="' + i + '" onclick="selectEntryStar(event,' + i + ')">';
            html += '<span class="es-dot"></span><span class="es-line"></span>';
            html += '<span class="es-label">' + art.name + '</span>';
            html += '</div>';
        });
        html += '</div>';

        html += '<div class="article-doc-panel" id="article-doc-panel"></div>';

        html += '<div id="nav-area">';
        if (era.next) {
            var nextEra = getEra(era.next);
            html += '<div class="nav-section-label">▼ 下一时代</div>';
            html += '<div class="nav-buttons">';
            html += '<div class="nav-btn main-path" onclick="goNext(' + era.next + ')"><span class="btn-era-name">' + nextEra.name + '</span><span class="btn-era-time">' + nextEra.time + '</span></div>';
            html += '</div>';
        } else {
            html += renderContinuEnd();
        }
        html += '</div>';

        var display = document.querySelector('.era-display');
        var expandHint = display.querySelector('.expand-hint');
        if (expandHint) expandHint.remove();
        display.insertAdjacentHTML('beforeend', html);

        requestAnimationFrame(function() {
            requestAnimationFrame(function() {
                var container = document.getElementById('entry-constellation');
                if (!container) return;
                var stars = container.querySelectorAll('.entry-star');
                for (var i = 0; i < stars.length - 1; i++) {
                    var a = stars[i].querySelector('.es-dot').getBoundingClientRect();
                    var b = stars[i + 1].querySelector('.es-dot').getBoundingClientRect();
                    var cRect = container.getBoundingClientRect();
                    var ax = a.left + a.width / 2 - cRect.left;
                    var ay = a.top + a.height / 2 - cRect.top;
                    var bx = b.left + b.width / 2 - cRect.left;
                    var by = b.top + b.height / 2 - cRect.top;
                    var dx = bx - ax, dy = by - ay;
                    var len = Math.sqrt(dx * dx + dy * dy);
                    var angle = Math.atan2(dy, dx) * (180 / Math.PI);
                    var line = document.createElement('div');
                    line.className = 'entry-zigzag-line';
                    line.style.left = ax + 'px';
                    line.style.top = ay + 'px';
                    line.style.width = len + 'px';
                    line.style.transform = 'rotate(' + angle + 'deg)';
                    line.style.animation = 'eraFadeIn 0.4s ease ' + (i * 0.06) + 's both';
                    container.appendChild(line);
                }
            });
        });
    }

    function selectEntryStar(e, idx) {
        e.stopPropagation();

        var art = era.articles[idx];

        others.forEach(function(s, i) {
            setTimeout(function() {
                s.style.transition = 'opacity 0.45s ease';
                s.style.opacity = '0';
                s.style.pointerEvents = 'none';

        });

        zlines.forEach(function(l, i) {
            setTimeout(function() {
                l.style.transition = 'opacity 0.4s ease';

            }, 100 + i * 60);

            if (header) { header.style.transition = 'opacity 0.4s ease'; header.style.opacity = '0'; header.style.pointerEvents = 'none'; }
            if (navArea) { navArea.style.transition = 'opacity 0.4s ease'; navArea.style.opacity = '0'; navArea.style.pointerEvents = 'none'; }
        }, 300);

        if (clicked) {
            clicked.style.zIndex = '10';
            setTimeout(function() {
                clicked.style.transition = 'transform 0.35s ease';
                clicked.style.transform = 'scale(1.45)';
            }, 350);

                clicked.style.transition = 'transform 0.3s ease, opacity 0.35s ease';

                clicked.style.pointerEvents = 'none';

        setTimeout(function() {

                + '<div class="doc-section"><h5>概述</h5><div>' + (art.outline || '') + '</div></div>'
                + '<div class="doc-section"><h5>定位</h5><div>' + (art.position || '') + '</div></div>'
                + '<div class="doc-section"><h5>结构</h5><div>' + (art.structure || '') + '</div></div>'
                + '<div class="doc-meta">' + (art.meta || '') + '</div>'
                + '<div class="doc-link">🔗 <a href="' + (art.link || '#') + '" target="_blank">' + (art.link || '') + '</a></div>'
                + '</div>';
            panel.classList.add('open');
        }, 1000);
    }

    function revealEnding(dataStr) {
        const data = JSON.parse(decodeURIComponent(dataStr));

        const icon = isContinue ? '✦' : '◈';
        const subtitle = isContinue ? '故事尚未终结，新的篇章等待书写……' : '时间线在此处收束。';
        const cleanOutcome = (data.outcome || '——').replace('【结局】：','');
        contentArea.innerHTML = `<div class="ending-screen" style="padding:60px 20px;animation:eraFadeIn 0.5s ease">

    <div class="ending-line-name">── ${cleanOutcome} ──</div>
    <div class="ending-title">${data.articleName}</div>
    <div class="ending-sub">${subtitle}</div>
    <button class="restart-btn" onclick="restartJourney()">⟳ 回到最开始的地方</button>
  </div>`;
        const header = document.querySelector('#era-info-panel .panel-header');
        header.querySelector('.panel-sys-label').innerHTML = '<span class="panel-rec-dot"></span> TERMINAL';
        header.querySelector('.panel-era-name').textContent = cleanOutcome;
        header.querySelector('.panel-era-time').textContent = data.articleName;
        panelBody.innerHTML = '<div class="panel-summary">' + subtitle + '</div>';
        scrollToTop();

            + '<div class="hud-typing-wrap"><span class="hud-typing-label">LOG·DATA</span><span class="hud-typing-text" id="hud-typing-text"></span><span class="hud-typing-cursor">_</span></div>'
            + '<div class="hud-bars">'
            + '<div class="hud-bar-group"><span class="hud-bar-label">PWR</span><div class="hud-bar-track"><div class="hud-bar-fill pwr" id="hud-pwr-bar"></div></div><span class="hud-bar-val" id="hud-pwr-val">87%</span></div>'
            + '<div class="hud-bar-group"><span class="hud-bar-label">SCN</span><div class="hud-bar-track"><div class="hud-bar-fill scn" id="hud-scn-bar"></div></div><span class="hud-bar-val" id="hud-scn-val">42%</span></div>'
            + '<div class="hud-bar-group"><span class="hud-bar-label">SIG</span><div class="hud-bar-track hud-pulse-track"><div class="hud-pulse-ring"></div><div class="hud-pulse-ring"></div><div class="hud-pulse-dot"></div></div><span class="hud-bar-val">光脉</span></div>'
            + '</div>';
        sf.appendChild(hud);
        hud.classList.add('visible');
        var mainRect = main.getBoundingClientRect();
        var padX = 60, padY = 80;
        var areaW = mainRect.width - padX * 2, areaH = mainRect.height - padY * 2;
        var cols = window.innerWidth <= 768 ? 2 : 4;
        var rows = Math.ceil(timelineData.length / cols);
        var cellW = areaW / cols, cellH = areaH / rows;
        var total = timelineData.length;

        for (var i = 0; i < total; i++) {
            var col = i % cols, row = Math.floor(i / cols);
            var px = padX + cellW * col + Math.random() * cellW * 0.85;
            var py = padY + cellH * row + Math.random() * cellH * 0.8;
            var era = timelineData[i];
            var isBranch = era.type === 'branch';
            var el = document.createElement('div');
            el.className = 'star-point' + (isBranch ? ' branch-star' : '');
            el.style.left = px + 'px'; el.style.top = py + 'px';
            el.style.animationDelay = (Math.random() * 0.5) + 's';
            el.style.animation = 'starAppear 0.6s ease both';
            el.setAttribute('data-era', era.id);
            el.innerHTML = '<span class="star-dot"></span><span class="star-line"></span><span class="star-label">' + era.name + '</span><span class="star-time">' + era.time + '</span>';
            (function(eid) {
                el.addEventListener('click', function() { starClick(eid); });
            })(era.id);
            starsWrap.appendChild(el);
        }

        requestAnimationFrame(function() {
            requestAnimationFrame(function() {
                var stars = sf.querySelectorAll('.star-point');
                for (var i = 0; i < stars.length - 1; i++) {
                    var a = stars[i].getBoundingClientRect();
                    var b = stars[i + 1].getBoundingClientRect();
                    var sfRect = sf.getBoundingClientRect();
                    var ax = a.left + a.width / 2 - sfRect.left;
                    var ay = a.top + a.height / 2 - sfRect.top;
                    var bx = b.left + b.width / 2 - sfRect.left;
                    var by = b.top + b.height / 2 - sfRect.top;
                    var dx = bx - ax, dy = by - ay;
                    var len = Math.sqrt(dx * dx + dy * dy);
                    var angle = Math.atan2(dy, dx) * (180 / Math.PI);
                    var line = document.createElement('div');
                    line.className = 'star-constellation-line';
                    line.setAttribute('data-from', stars[i].getAttribute('data-era'));
                    line.setAttribute('data-to', stars[i + 1].getAttribute('data-era'));
                    line.style.left = ax + 'px';
                    line.style.top = ay + 'px';
                    line.style.width = len + 'px';
                    line.style.transform = 'rotate(' + angle + 'deg)';
                    line.style.animation = 'eraFadeIn 0.5s ease ' + (i * 0.06) + 's both';
                    starsWrap.appendChild(line);
                }
            });
        });

        main.appendChild(sf);
        ctrlsWrapper.classList.add('visible');
        starfieldToggleBtn.textContent = '☰ 目录';
        starfieldToggleBtn.setAttribute('data-mode', 'star');

        setTimeout(function() {
            var allStars = sf.querySelectorAll('.star-point');
            allStars.forEach(function(s) { s.style.animation = ''; });
        }, 700);

        startHudTyping();
        startHudBars();

        if (starTwinkleTimer) clearInterval(starTwinkleTimer);
        starTwinkleTimer = setInterval(function() {
            var stars = document.querySelectorAll('#starfield .star-point');
            if (!stars || stars.length === 0) return;
            var idx = Math.floor(Math.random() * stars.length);
            var star = stars[idx];
            star.style.animation = 'none';
            star.style.transition = 'opacity 0.3s ease';
            star.style.opacity = '0';
            setTimeout(function() {
                star.style.transition = 'opacity 0.5s ease';
                star.style.opacity = '1';
            }, 400);
        }, 1800 + Math.random() * 1200);
    }

    function starClick(eraId) {
        var sf = document.getElementById('starfield');
        if (!sf) return;
        if (starTwinkleTimer) { clearInterval(starTwinkleTimer); starTwinkleTimer = null; }

        var star = sf.querySelector('.star-point[data-era="' + eraId + '"]');
        var otherStars = sf.querySelectorAll('.star-point:not([data-era="' + eraId + '"])');
        var lines = sf.querySelectorAll('.star-constellation-line');

        otherStars.forEach(function(s, i) {
            setTimeout(function() {
                s.style.transition = 'opacity 0.55s ease';
                s.style.opacity = '0';
                s.style.pointerEvents = 'none';
            }, i * 70);
        });

        lines.forEach(function(l, i) {
            setTimeout(function() {
                l.style.transition = 'opacity 0.4s ease';
                l.style.opacity = '0';
            }, i * 50);
        });

        if (star) {
            star.style.zIndex = '10';
            setTimeout(function() {
                star.style.transition = 'transform 0.3s ease';
                star.style.transform = 'scale(1.5)';
            }, 100);
            setTimeout(function() {
                star.style.transition = 'transform 0.35s ease';
                star.style.transform = 'scale(1)';
            }, 400);
        }

        var dimDelay = otherStars.length * 70 + 300;
        setTimeout(function() {
            sf.style.transition = 'opacity 0.35s ease';
            sf.style.opacity = '0';
        }, dimDelay);

        setTimeout(function() {
            sf.style.display = 'none';
            sf.style.transition = '';
            sf.style.opacity = '';
            if (star) { star.style.transform = ''; star.style.zIndex = ''; }
            currentEraId = eraId;
            eraExpanded = false;
            updateInfoPanel(eraId);
            renderEra(eraId);
            returnStarsBtn.classList.add('visible');
            ctrlsWrapper.classList.remove('visible');
            scrollToTop();
        }, dimDelay + 350);
    }

    function returnToStars() {
        eraExpanded = false;
        currentEraId = null;
        contentArea.innerHTML = '';
        clearInfoPanel();
        returnStarsBtn.classList.remove('visible');
        ctrlsWrapper.classList.add('visible');
        starfieldToggleBtn.textContent = '☰ 目录';
        starfieldToggleBtn.setAttribute('data-mode', 'star');
        const oldSf = document.getElementById('starfield');
        if (oldSf) oldSf.remove();
        buildStarfield();
        const newSf = document.getElementById('starfield');
        if (newSf) {
            newSf.style.transition = 'none';
            newSf.style.transform = 'translateY(-80vh)';
            newSf.style.opacity = '0';
            requestAnimationFrame(function() {
                requestAnimationFrame(function() {
                    newSf.style.transition = 'transform 0.6s cubic-bezier(0.4,0,0.2,1), opacity 0.5s ease';
                    newSf.style.transform = 'translateY(0)';
                    newSf.style.opacity = '1';
                });
            });
        }
        scrollToTop();
    }

    function toggleStarfieldView() {
        var mode = starfieldToggleBtn.getAttribute('data-mode');
        if (mode === 'star') {
            buildOrderedList();
            starfieldToggleBtn.textContent = '✦ 星图';
            starfieldToggleBtn.setAttribute('data-mode', 'list');
        } else {
            var sf = document.getElementById('starfield');
            if (!sf) return;
            var list = sf.querySelector('.starfield-list');
            if (list) list.classList.remove('active');
            var stars = sf.querySelectorAll('.star-point');
            var lines = sf.querySelectorAll('.star-constellation-line');
            stars.forEach(function(s) { s.style.display = ''; s.style.pointerEvents = 'auto'; });
            lines.forEach(function(l) { l.style.display = ''; });
            starfieldToggleBtn.textContent = '☰ 目录';
            starfieldToggleBtn.setAttribute('data-mode', 'star');
        }
    }

    function buildOrderedList() {
        var sf = document.getElementById('starfield');
        if (!sf) return;
        var stars = sf.querySelectorAll('.star-point');
        var lines = sf.querySelectorAll('.star-constellation-line');
        stars.forEach(function(s) { s.style.display = 'none'; s.style.pointerEvents = 'none'; });
        lines.forEach(function(l) { l.style.display = 'none'; });
        var list = sf.querySelector('.starfield-list');
        if (!list) {
            list = document.createElement('div');
            list.className = 'starfield-list';
            sf.appendChild(list);
        }
        list.innerHTML = '';
        list.classList.add('active');
        timelineData.forEach(function(era, i) {
            var entry = document.createElement('div');
            entry.className = 'sl-entry' + (era.type === 'branch' ? ' branch-marker' : '');
            entry.style.animationDelay = (i * 0.04) + 's';
            entry.innerHTML = '<span class="sl-index">' + String(i + 1).padStart(2, '0') + '</span>'
                + '<span class="sl-marker"></span>'
                + '<span class="sl-name">' + era.name + '</span>'
                + '<span class="sl-time">' + era.time + '</span>';
            (function(eid) {
                entry.addEventListener('click', function() { starClick(eid); });
            })(era.id);
            list.appendChild(entry);
        });
    }

    var hudTypingTimer = null;
    var hudBarsTimer = null;

    function startHudTyping() {
        if (hudTypingTimer) clearTimeout(hudTypingTimer);
        var lines = [];
        timelineData.forEach(function(era) {
            if (era.desc) { era.desc.forEach(function(d) { if (d.indexOf('【结局】') === -1 && d.indexOf('【内容】') === -1) lines.push(d); }); }
            if (era.summary) lines.push(era.summary);
        });
        if (lines.length === 0) return;
        function cycle() {
            var textEl = document.getElementById('hud-typing-text');
            if (!textEl) { hudTypingTimer = setTimeout(cycle, 2000); return; }
            var line = lines[Math.floor(Math.random() * lines.length)];
            var i = 0;
            textEl.textContent = '';
            function type() {
                if (i < line.length) {
                    textEl.textContent = line.substring(0, i + 1);
                    i++;
                    hudTypingTimer = setTimeout(type, 40 + Math.random() * 30);
                } else {
                    hudTypingTimer = setTimeout(function() {
                        textEl.textContent = '';
                        hudTypingTimer = setTimeout(cycle, 800 + Math.random() * 1500);
                    }, 2200 + Math.random() * 2000);
                }
            }
            type();
        }
        cycle();
    }

    function startHudBars() {
        if (hudBarsTimer) clearInterval(hudBarsTimer);
        hudBarsTimer = setInterval(function() {
            var pwrBar = document.getElementById('hud-pwr-bar');
            var pwrVal = document.getElementById('hud-pwr-val');
            var scnBar = document.getElementById('hud-scn-bar');
            var scnVal = document.getElementById('hud-scn-val');
            if (pwrBar && pwrVal) {
                var pwr = 82 + Math.floor(Math.random() * 14);
                pwrBar.style.width = pwr + '%';
                pwrVal.textContent = pwr + '%';
            }
            if (scnBar && scnVal) {
                var scn = 30 + Math.floor(Math.random() * 50);
                scnBar.style.width = scn + '%';
                scnVal.textContent = scn + '%';
            }
        }, 1800);
    }

    (function initMouseParallax() {
        var main = document.getElementById('main');
        var targetX = 0, targetY = 0, currentX = 0, currentY = 0;
        main.addEventListener('mousemove', function(e) {
            var rect = main.getBoundingClientRect();
            var cx = rect.width / 2, cy = rect.height / 2;
            targetX = (e.clientX - rect.left - cx) / cx * 10;
            targetY = (e.clientY - rect.top - cy) / cy * 10;
        });
        main.addEventListener('mouseleave', function() { targetX = 0; targetY = 0; });
        function animate() {
            currentX += (targetX - currentX) * 0.06;
            currentY += (targetY - currentY) * 0.06;
            var sf = document.getElementById('starfield');
            var wrap = sf ? sf.querySelector('.starfield-stars') : null;
            if (wrap && sf.style.display !== 'none') {
                wrap.style.transform = 'translate(' + currentX + 'px,' + currentY + 'px)';
            }
            requestAnimationFrame(animate);
        }
        animate();
    })();

    (function initCanvas() {
        const c = document.getElementById('bg-canvas');
        const ctx = c.getContext('2d');
        let w, h, particles = [];
        function resize() { w = c.width = window.innerWidth; h = c.height = window.innerHeight; }
        resize(); window.addEventListener('resize', resize);
        for (let i = 0; i < 80; i++) {
            particles.push({ x: Math.random()*w, y: Math.random()*h, r: Math.random()*1.5+0.4,
                vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3, a: Math.random()*0.5+0.2 });
        }
        function draw() {
            ctx.clearRect(0,0,w,h);
            ctx.strokeStyle = 'rgba(61,192,216,0.05)'; ctx.lineWidth = 1;
            const gs = 50;
            for (let x = gs; x < w; x += gs) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
            for (let y = gs; y < h; y += gs) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if (p.x<0||p.x>w) p.vx*=-1; if (p.y<0||p.y>h) p.vy*=-1;
                ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
                ctx.fillStyle = `rgba(94,224,244,${p.a})`; ctx.fill();
            });
            for (let i=0;i<particles.length;i++) {
                for (let j=i+1;j<particles.length;j++) {
                    const dx=particles[i].x-particles[j].x, dy=particles[i].y-particles[j].y;
                    const dist=Math.sqrt(dx*dx+dy*dy);
                    if(dist<100){ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);
                        ctx.lineTo(particles[j].x,particles[j].y);
                        ctx.strokeStyle=`rgba(61,192,216,${0.06*(1-dist/100)})`;ctx.stroke();}
                }
            }
            requestAnimationFrame(draw);
        }
        draw();
    })();

    (function setupMainResizeObserver() {
        var mainEl = document.getElementById('main');
        if (!mainEl) return;
        var ro = new ResizeObserver(function() {
            var sf = document.getElementById('starfield');
            if (!sf) return;
            sf.style.width = mainEl.clientWidth + 'px';
            sf.style.height = mainEl.clientHeight + 'px';
            var hud = sf.querySelector('.starfield-hud');
            if (hud) { void hud.offsetHeight; }
        });
        ro.observe(mainEl);
    })();
    (function initMobile() {
        if (window.innerWidth <= 768) {
            var panel = document.getElementById('era-info-panel');
            if (panel) panel.classList.add('collapsed');
        }
    })();
    buildStarfield();
</script>
</body>
</html>
