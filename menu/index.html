<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第九边缘：木缘桑庭 · 时间线</title>
    <style>
        :root {
            --bg-deep: #0a0e1a;
            --bg-panel: rgba(14, 22, 48, 0.85);
            --bg-card: rgba(20, 32, 64, 0.75);
            --accent: #4da8da;
            --accent-glow: #6cc4f0;
            --accent-dim: #2a5f8a;
            --text-primary: #e0e8f0;
            --text-secondary: #8aa0c0;
            --text-dim: #506080;
            --border: rgba(77, 168, 218, 0.2);
            --border-bright: rgba(77, 168, 218, 0.5);
            --danger: #e0556a;
            --warning: #d4a84b;
            --success: #4bc0a0;
            --info: #4da8da;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            display: flex;
            user-select: none;
        }

        #bg-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }

        #app { display: flex; width: 100%; height: 100%; position: relative; z-index: 1; }

        #sidebar {
            width: 260px; min-width: 260px; height: 100%;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            backdrop-filter: blur(12px);
            display: flex; flex-direction: column;
            overflow: hidden; z-index: 2;
        }
        #sidebar-header {
            padding: 20px 16px 14px; border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        #sidebar-header h2 {
            font-size: 17px; font-weight: 700; color: var(--accent-glow);
            letter-spacing: 2px; margin-bottom: 4px;
        }
        #sidebar-header .sub {
            font-size: 11px; color: var(--text-dim); letter-spacing: 1px;
        }
        #sidebar-tree {
            flex: 1; overflow-y: auto; overflow-x: hidden;
            padding: 8px 0 20px;
            scrollbar-width: thin; scrollbar-color: var(--accent-dim) transparent;
        }
        #sidebar-tree::-webkit-scrollbar { width: 4px; }
        #sidebar-tree::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 2px; }

        .tree-node { position: relative; cursor: pointer; transition: all 0.2s; }
        .tree-node-inner {
            display: flex; align-items: flex-start; padding: 8px 14px 8px 20px;
            gap: 8px; font-size: 13px; line-height: 1.4;
            border-left: 2px solid transparent; transition: all 0.25s;
        }
        .tree-node.active .tree-node-inner {
            background: rgba(77, 168, 218, 0.1); border-left-color: var(--accent);
        }
        .tree-node:hover .tree-node-inner { background: rgba(77, 168, 218, 0.05); }
        .tree-dot {
            width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
            margin-top: 4px; background: var(--accent-dim); transition: all 0.3s;
        }
        .tree-node.active .tree-dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
        .tree-node.branch .tree-dot { background: var(--warning); }
        .tree-node.branch.active .tree-dot { box-shadow: 0 0 8px var(--warning); }
        .tree-label { flex: 1; min-width: 0; }
        .tree-label .era-name { font-weight: 600; color: var(--text-primary); display: block; }
        .tree-label .era-time { font-size: 10px; color: var(--text-dim); letter-spacing: 1px; display: block; }

        #main {
            flex: 1; height: 100%; display: flex; flex-direction: column;
            overflow: hidden; position: relative; min-width: 0;
        }

        #era-info-panel {
            width: 280px; min-width: 280px; height: 100%;
            background: #080d18; border-left: 1px solid var(--border);
            display: flex; flex-direction: column;
            overflow: hidden; z-index: 2; transition: all 0.3s;
            position: relative;
        }
        #era-info-panel::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px);
        }
        #era-info-panel .panel-header {
            padding: 18px 16px 12px; border-bottom: 1px solid var(--border);
            flex-shrink: 0; position: relative; z-index: 11;
        }
        #era-info-panel .panel-header .panel-sys-label {
            font-size: 10px; font-weight: 700; color: var(--accent-dim);
            letter-spacing: 3px; text-transform: uppercase; margin-bottom: 6px;
            display: flex; align-items: center; gap: 8px;
        }
        #era-info-panel .panel-header .panel-rec-dot {
            display: inline-block; width: 8px; height: 8px; border-radius: 50%;
            background: #4bc0a0; box-shadow: 0 0 8px #4bc0a0;
            animation: recPulse 1.6s ease-in-out infinite;
        }
        @keyframes recPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        #era-info-panel .panel-header .panel-era-name {
            font-size: 16px; font-weight: 800; color: var(--text-primary);
            margin-bottom: 2px; position: relative; z-index: 11;
        }
        #era-info-panel .panel-header .panel-era-time {
            font-size: 10px; color: var(--accent-dim); letter-spacing: 1px;
            font-family: "Consolas", "Courier New", monospace; position: relative; z-index: 11;
        }
        #era-info-panel .panel-body {
            flex: 1; overflow-y: auto; padding: 14px; position: relative; z-index: 11;
            scrollbar-width: thin; scrollbar-color: var(--accent-dim) transparent;
        }
        #era-info-panel .panel-body::-webkit-scrollbar { width: 4px; }
        #era-info-panel .panel-body::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 2px; }
        #era-info-panel .panel-summary {
            font-size: 13px; color: var(--text-primary); line-height: 1.8;
            padding: 12px 14px; border-radius: 6px; margin-bottom: 10px;
            background: rgba(77,168,218,0.06); border: 1px solid rgba(77,168,218,0.12);
            font-family: "Consolas", "Courier New", "Microsoft YaHei", monospace;
            letter-spacing: 0.5px; position: relative;
        }
        #era-info-panel .panel-summary::before {
            content: '// SUMMARY'; display: block; font-size: 9px;
            color: var(--accent-dim); letter-spacing: 2px; margin-bottom: 6px;
            font-family: "Consolas", monospace;
        }
        #era-info-panel .panel-detail-toggle {
            font-size: 10px; color: var(--accent-dim); cursor: pointer;
            letter-spacing: 2px; padding: 6px 0; text-align: center;
            transition: color 0.3s; border-top: 1px solid var(--border);
            margin-top: 6px; user-select: none;
        }
        #era-info-panel .panel-detail-toggle:hover { color: var(--accent-glow); }
        #era-info-panel .panel-detail-toggle::after {
            content: ' ▾'; font-size: 10px;
        }
        #era-info-panel .panel-detail-toggle.expanded::after {
            content: ' ▴';
        }
        #era-info-panel .panel-desc-line {
            font-size: 12px; color: var(--text-secondary); line-height: 1.7;
            margin-bottom: 2px; padding: 8px 10px; border-radius: 3px;
            border-left: 2px solid var(--border);
            background: rgba(255,255,255,0.015);
            transition: all 0.2s; font-family: "Consolas", "Courier New", "Microsoft YaHei", monospace;
        }
        #era-info-panel .panel-desc-line::before {
            content: '> '; color: var(--accent-dim); font-family: "Consolas", monospace; font-size: 10px;
        }
        #era-info-panel .panel-desc-line:hover {
            border-left-color: var(--accent-dim);
            background: rgba(255,255,255,0.03);
        }
        #era-info-panel .panel-detail-list {
            display: none; margin-top: 4px;
        }
        #era-info-panel .panel-detail-list.visible { display: block; }
        #era-info-panel .panel-default-hint {
            font-size: 12px; color: var(--text-dim); text-align: center;
            padding: 30px 10px; letter-spacing: 1px; font-family: "Consolas", "Courier New", monospace;
        }

        .view-era-btn {
            display: inline-block; margin-top: 20px; padding: 12px 36px;
            border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer;
            letter-spacing: 2px; background: linear-gradient(135deg, #4da8da, #2a6fa0);
            color: #fff; border: none; transition: all 0.3s;
        }
        .view-era-btn:hover {
            box-shadow: 0 0 24px rgba(77,168,218,0.5); transform: translateY(-2px);
        }

        .article-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 4, 12, 0.82); z-index: 200;
            display: flex; align-items: center; justify-content: center;
            animation: fadeIn 0.2s ease; backdrop-filter: blur(4px);
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .article-modal {
            background: var(--bg-panel); border: 1px solid var(--border-bright);
            border-radius: 14px; width: 90%; max-width: 640px; max-height: 82vh;
            overflow-y: auto; padding: 28px 32px; position: relative;
            animation: modalSlide 0.3s ease;
            scrollbar-width: thin; scrollbar-color: var(--accent-dim) transparent;
        }
        @keyframes modalSlide { from { opacity:0; transform:translateY(20px) scale(0.97); } to { opacity:1; transform:translateY(0) scale(1); } }
        .article-modal::-webkit-scrollbar { width: 4px; }
        .article-modal::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 2px; }

        .article-modal .modal-close {
            position: absolute; top: 12px; right: 16px;
            width: 32px; height: 32px; border-radius: 8px;
            border: 1px solid var(--border); background: var(--bg-card);
            color: var(--text-secondary); font-size: 16px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .article-modal .modal-close:hover { border-color: var(--accent); color: var(--accent-glow); }
        .article-modal .modal-type-tag {
            display: inline-block; font-size: 10px; letter-spacing: 1px;
            padding: 2px 8px; border-radius: 4px; font-weight: 600; margin-bottom: 10px;
        }
        .article-modal .modal-title { font-size: 22px; font-weight: 800; color: var(--text-primary); margin-bottom: 14px; }
        .article-modal .modal-section { margin-bottom: 18px; }
        .article-modal .modal-section h5 {
            font-size: 12px; font-weight: 700; color: var(--accent-glow);
            letter-spacing: 1px; margin-bottom: 6px;
        }
        .article-modal .modal-section p, .article-modal .modal-section div {
            font-size: 14px; color: var(--text-secondary); line-height: 1.85;
        }
        .article-modal .modal-meta {
            margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border);
            font-size: 11px; color: var(--text-dim); line-height: 1.6;
        }
        .article-modal .modal-link {
            margin-top: 14px; font-size: 12px;
        }
        .article-modal .modal-link a {
            color: var(--accent-glow); text-decoration: none; word-break: break-all;
        }
        .article-modal .modal-link a:hover { text-decoration: underline; }

        #content-area {
            flex: 1; overflow-y: auto; padding: 48px 32px;
            display: flex; flex-direction: column; align-items: center;
            justify-content: safe center;
            scrollbar-width: thin; scrollbar-color: var(--accent-dim) transparent;
        }
        #content-area::-webkit-scrollbar { width: 5px; }
        #content-area::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 3px; }

        .era-display {
            width: 100%; max-width: 720px; margin: 0 auto;
            transition: transform 0.2s ease;
        }
        .era-display:hover {
            transform: translateX(4px) translateY(-2px);
        }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .era-header {
            text-align: center; margin: 0 auto 6px;
        }
        .era-badge {
            display: inline-block; padding: 4px 14px; border-radius: 20px;
            font-size: 11px; letter-spacing: 2px; font-weight: 600;
            border: 1px solid var(--border-bright); color: var(--accent-glow);
            margin-bottom: 8px;
        }
        .era-badge.branch-badge { border-color: var(--warning); color: var(--warning); }
        .era-title {
            font-size: 36px; font-weight: 800; letter-spacing: 3px;
            background: linear-gradient(135deg, #c8e6ff, #4da8da);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin-bottom: 8px; line-height: 1.3;
        }
        .era-time-large {
            font-size: 15px; color: var(--accent-glow); letter-spacing: 2px;
            font-family: "Consolas", "Courier New", monospace;
            margin-bottom: 0;
        }
        .era-desc {
            display: flex; flex-direction: column; gap: 6px;
            align-items: center; margin-top: 12px;
        }
        .era-desc-line {
            font-size: 14px; color: var(--text-secondary); max-width: 500px;
            text-align: center; line-height: 1.7;
        }

        .era-articles { display: flex; flex-direction: column; gap: 16px; margin-top: 24px; }

        .era-articles-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
            gap: 14px; margin-top: 8px;
        }
        .article-grid-slot {
            border-radius: 10px; min-height: 100px; transition: all 0.3s;
        }
        .article-grid-slot .article-card {
            height: 100%; cursor: pointer;
        }
        .article-grid-slot.empty-slot {
            border: 1px dashed var(--border); background: rgba(20,32,64,0.25);
            display: flex; align-items: center; justify-content: center;
            color: var(--text-dim); font-size: 13px; letter-spacing: 1px;
            flex-direction: column; gap: 4px;
        }
        .article-grid-slot.empty-slot .empty-icon {
            font-size: 20px; opacity: 0.4;
        }
        .article-grid-slot.empty-slot .empty-label {
            font-size: 12px; opacity: 0.5;
        }

        .era-articles-standalone {
            display: flex; flex-direction: column; gap: 14px; margin-top: 14px;
        }

        .era-desc-center {
            margin: 2px auto 0; max-width: 560px; text-align: center;
        }
        .era-desc-center .desc-center-line {
            font-size: 14px; color: var(--text-secondary); line-height: 1.8;
            padding: 1px 0;
        }

        .article-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 10px; padding: 20px 24px;
            cursor: pointer; transition: all 0.3s;
            position: relative; overflow: hidden;
        }
        .article-card:hover {
            border-color: var(--border-bright);
            box-shadow: 0 0 24px rgba(77,168,218,0.12);
            transform: translateY(-2px);
        }
        .article-card::before {
            content: ''; position: absolute; left: 0; top: 0; width: 4px; height: 100%;
            border-radius: 4px 0 0 4px;
        }
        .article-card.type-line::before, .article-card.type-WORLD_LINE::before { background: var(--info); }
        .article-card.type-plan::before, .article-card.type-WORLD_PLANING::before { background: var(--accent); }
        .article-card.type-background::before, .article-card.type-WORLD_BACKGROUND::before { background: var(--success); }
        .article-card.type-theory::before, .article-card.type-WORLD_THEORY::before { background: var(--warning); }
        .article-card.type-thought::before, .article-card.type-THOUGHTS_COLLIDE::before { background: #a078d4; }
        .article-card.type-ifline::before, .article-card.type-IF_LINE::before { background: var(--danger); }

        .article-card-top {
            display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
        }
        .article-card-type-tag {
            font-size: 10px; letter-spacing: 1px; padding: 2px 8px;
            border-radius: 4px; font-weight: 600;
        }
        .tag-line { background: rgba(77,168,218,0.2); color: var(--info); }
        .tag-plan { background: rgba(77,168,218,0.25); color: var(--accent-glow); }
        .tag-background { background: rgba(75,192,160,0.2); color: var(--success); }
        .tag-theory { background: rgba(212,168,75,0.2); color: var(--warning); }
        .tag-thought { background: rgba(160,120,212,0.2); color: #b890e8; }
        .tag-ifline { background: rgba(224,85,106,0.2); color: var(--danger); }

        .article-card-title {
            font-size: 16px; font-weight: 700; color: var(--text-primary);
        }
        .article-card-intro {
            font-size: 13px; color: var(--text-secondary); line-height: 1.7;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .article-card-link {
            margin-top: 10px; font-size: 11px; color: var(--accent-glow);
            opacity: 0.7;
        }

        .article-card.expanded {
            border-color: var(--border-bright);
            box-shadow: 0 0 32px rgba(77,168,218,0.18);
        }
        .article-card.expanded .article-card-intro {
            -webkit-line-clamp: unset; display: block;
        }
        .article-detail { margin-top: 14px; display: none; }
        .article-card.expanded .article-detail { display: block; }
        .article-detail-section {
            margin-bottom: 10px;
        }
        .article-detail-section h5 {
            font-size: 12px; font-weight: 700; color: var(--accent-glow);
            letter-spacing: 1px; margin-bottom: 4px;
        }
        .article-detail-section p, .article-detail-section div {
            font-size: 13px; color: var(--text-secondary); line-height: 1.8;
        }
        .article-card-meta {
            margin-top: 10px; font-size: 11px; color: var(--text-dim);
            border-top: 1px solid var(--border); padding-top: 10px;
        }

        #nav-area {
            width: 100%; max-width: 720px; margin: 0 auto;
            display: flex; flex-direction: column; align-items: center;
            gap: 12px; margin-top: 40px; padding-bottom: 60px;
        }
        .nav-section-label {
            font-size: 12px; color: var(--text-dim); letter-spacing: 2px;
            text-align: center; margin-bottom: 4px; text-transform: uppercase;
        }
        .nav-buttons { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

        .nav-btn {
            padding: 14px 28px; border-radius: 10px; font-size: 14px; font-weight: 600;
            cursor: pointer; border: 1px solid var(--border);
            background: var(--bg-card); color: var(--text-primary);
            transition: all 0.3s; letter-spacing: 1px; text-align: center;
            min-width: 160px; position: relative; overflow: hidden;
        }
        .nav-btn:hover {
            border-color: var(--border-bright); transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(77,168,218,0.2);
        }
        .nav-btn.main-path { border-color: var(--accent); background: rgba(77,168,218,0.1); }
        .nav-btn.main-path:hover { background: rgba(77,168,218,0.2); box-shadow: 0 4px 24px rgba(77,168,218,0.3); }
        .nav-btn.alt-path { border-color: var(--warning); }
        .nav-btn.alt-path:hover { box-shadow: 0 4px 20px rgba(212,168,75,0.2); }
        .nav-btn .btn-era-name { display: block; font-size: 15px; margin-bottom: 2px; }
        .nav-btn .btn-era-time { display: block; font-size: 10px; color: var(--text-dim); letter-spacing: 1px; }
        .nav-btn .btn-outcome { display: block; font-size: 10px; margin-top: 4px; color: var(--danger); }

        .ending-screen {
            width: 100%; max-width: 600px; margin: 0 auto;
            text-align: center; padding: 60px 20px;
            animation: fadeSlideIn 0.5s ease;
        }
        .ending-screen .ending-icon { font-size: 48px; margin-bottom: 20px; }
        .ending-screen .ending-title {
            font-size: 28px; font-weight: 800; color: var(--accent-glow);
            margin-bottom: 8px; letter-spacing: 2px;
        }
        .ending-screen .ending-sub {
            font-size: 15px; color: var(--text-secondary); margin-bottom: 30px; line-height: 1.7;
        }
        .ending-screen .ending-line-name {
            font-size: 12px; color: var(--danger); letter-spacing: 2px; margin-bottom: 6px;
        }

        .restart-btn {
            display: inline-block; padding: 14px 40px; border-radius: 10px;
            font-size: 15px; font-weight: 700; cursor: pointer; letter-spacing: 2px;
            background: linear-gradient(135deg, #4da8da, #2a6fa0);
            color: #fff; border: none; transition: all 0.3s;
        }
        .restart-btn:hover {
            box-shadow: 0 0 30px rgba(77,168,218,0.5); transform: translateY(-2px);
        }

        .mystery-btn {
            border-color: var(--danger) !important;
            background: rgba(224,85,106,0.08) !important;
            min-width: 200px;
        }
        .mystery-btn:hover {
            border-color: #ff6b7a !important;
            box-shadow: 0 0 32px rgba(224,85,106,0.35) !important;
            background: rgba(224,85,106,0.18) !important;
            transform: translateY(-2px);
        }
        .mystery-text {
            display: block;
            font-size: 32px;
            font-weight: 800;
            color: var(--danger);
            letter-spacing: 6px;
            text-align: center;
            text-shadow: 0 0 12px rgba(224,85,106,0.4);
        }

        .expand-hint {
            text-align: center; margin-top: 20px;
        }
        .expand-hint span {
            display: inline-block; padding: 10px 30px; border-radius: 8px;
            font-size: 13px; letter-spacing: 2px; cursor: pointer;
            border: 1px dashed var(--border-bright); color: var(--accent-glow);
            transition: all 0.3s;
        }
        .expand-hint span:hover {
            background: rgba(77,168,218,0.1); border-style: solid;
        }

        .branch-options {
            display: flex; flex-wrap: wrap; gap: 16px; justify-content: center;
            margin-top: 20px;
        }
        .branch-option {
            flex: 1 1 280px; max-width: 380px; min-width: 240px;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 12px; padding: 22px 20px; cursor: pointer;
            transition: all 0.3s; position: relative; overflow: hidden;
        }
        .branch-option:hover {
            border-color: var(--border-bright);
            box-shadow: 0 0 24px rgba(77,168,218,0.14);
            transform: translateY(-3px);
        }
        .branch-option.selected {
            border-color: var(--accent);
            box-shadow: 0 0 28px rgba(77,168,218,0.22);
            background: rgba(77,168,218,0.08);
        }
        .branch-option .branch-label {
            font-size: 12px; font-weight: 700; letter-spacing: 2px;
            padding: 3px 10px; border-radius: 4px; display: inline-block;
            margin-bottom: 10px;
        }

            name: art.name, type: art.catLabel || art.type,
            tagClass: cardColorMap[art.type] || 'tag-line',
            intro: art.intro, outline: art.outline, position: art.position,
            structure: art.structure, meta: art.meta, link: art.link
        };
        setTimeout(() => showArticleModal(data), 300);
    }

    function rotateCards(dir) {
        const total = cardArticles.length;
        if (total === 0) return;
        cardActiveIdx = (cardActiveIdx + dir + total) % total;
        updateCardStage();
    }

    function initCardHoverScale() {
        const stage = document.getElementById('card-stage');
        if (!stage) return;

        stage.addEventListener('mouseover', function(e) {
            const slot = e.target.closest('.card-slot');
            if (!slot || slot.classList.contains('inactive')) return;
            const idx = parseInt(slot.getAttribute('data-idx'));
            const base = cardBaseTransforms[idx];
            if (base) {
                slot.style.transition = 'transform 0.25s cubic-bezier(0.33,0,0.66,1)';
                slot.style.transform = base + ' scale(1.12)';
                slot.style.zIndex = '30';
            }
        });

        stage.addEventListener('mouseout', function(e) {
            const slot = e.target.closest('.card-slot');
            if (!slot) return;
            const relatedSlot = e.relatedTarget && e.relatedTarget.closest('.card-slot');
            if (relatedSlot === slot) return;
            const idx = parseInt(slot.getAttribute('data-idx'));
            const base = cardBaseTransforms[idx];
            if (base) {
                slot.style.transition = 'transform 0.3s cubic-bezier(0.33,0,0.66,1)';
                slot.style.transform = base;
                const total = cardArticles.length;
                const dist = Math.abs(idx - cardActiveIdx);
                slot.style.zIndex = String(10 - dist);
            }
        });
    }

    function expandCurrentEra() {
        eraExpanded = true;
        const era = getEra(currentEraId);
        if (!era) return;
        if (era.type !== 'normal' || !era.articles) return;

        updateInfoPanel(currentEraId);

        let html = '';

        if (era.desc && era.desc.length > 0) {
            html += '<div class="era-desc-center">';
            era.desc.forEach(d => html += `<div class="desc-center-line">${d}</div>`);
            html += '</div>';
        }

        html += '<div class="era-card-stage" id="card-stage"></div>';
        html += '<div class="era-card-nav"><button class="nav-arrow" onclick="rotateCards(-1)">◀</button><span class="card-label" id="card-label"></span><button class="nav-arrow" onclick="rotateCards(1)">▶</button></div>';

        html += '<div id="nav-area">';
        if (era.next) {
            const nextEra = getEra(era.next);
            html += '<div class="nav-section-label">▼ 下一时代</div>';
            html += '<div class="nav-buttons">';
            html += `<div class="nav-btn main-path" onclick="goNext(${era.next})"><span class="btn-era-name">${nextEra.name}</span><span class="btn-era-time">${nextEra.time}</span></div>`;
            html += '</div>';
        } else {
            html += renderContinuEnd();
        }
        html += '</div>';

        const display = document.querySelector('.era-display');
        const expandHint = display.querySelector('.expand-hint');
        if (expandHint) expandHint.remove();
        display.insertAdjacentHTML('beforeend', html);
        setTimeout(() => initCardStage(currentEraId), 50);
    }

    function selectBranchOption(eraId, branchIdx) {
        const era = getEra(eraId);
        const branch = era.branches[branchIdx];

        eraExpanded = true;
        updateSidebarActive(null);

        let html = '<div class="era-display">';
        html += '<div class="era-header">';
        html += `<div class="era-badge">${branch.label}</div>`;
        html += `<div class="era-title">${branch.article ? branch.article.name : ''}</div>`;
        html += '</div>';

        if (branch.article) {
            const art = branch.article;
            const icon = cardIconMap[art.type] || '◇';
            const colorClass = cardColorMap[art.type] || 'tag-line';
            const data = encodeURIComponent(JSON.stringify({
                name: art.name, type: art.catLabel || art.type, tagClass: colorClass,
                intro: art.intro, outline: art.outline, position: art.position,
                structure: art.structure, meta: art.meta, link: art.link
            }));
            html += '<div class="era-card-stage" style="height:340px">';
            html += `<div class="card-slot" style="position:absolute;width:190px;height:290px;left:50%;top:50%;transform:translate(-50%,-50%);cursor:pointer;z-index:10" data-article="${data}" onclick="showBranchArticleModal(this)">`;
            html += '<div class="tarot-card">';
            html += `<span class="card-icon">${icon}</span>`;
            html += `<span class="card-type-strip ${colorClass}">${art.catLabel || art.type}</span>`;
            html += `<span class="card-name">${art.name}</span>`;
            html += '<span class="card-divider"></span>';
            html += '<span class="card-sub">点击查看详情</span>';
            html += '</div></div></div>';
        }

        html += '<div id="nav-area">';
        if (branch.outcome !== null && branch.nextEra === null) {
            const outcomeData = encodeURIComponent(JSON.stringify({
                outcome: branch.outcome,
                articleName: branch.article ? branch.article.name : '',
                hint: branch.hint || ''
            }));
            html += '<div class="nav-section-label" style="color:var(--danger)">⚠ 该选择将导向结局</div>';
            html += '<div class="nav-buttons">';
            html += `<div class="nav-btn mystery-btn" onclick="revealEnding('${outcomeData}')"><span class="mystery-text">？？？</span></div>`;
            html += '</div>';
        } else if (branch.nextEra) {
            const nextEra = getEra(branch.nextEra);
            html += '<div class="nav-section-label">▼ 下一时代</div>';
            html += '<div class="nav-buttons">';
            html += `<div class="nav-btn main-path" onclick="goNext(${branch.nextEra})"><span class="btn-era-name">${nextEra.name}</span><span class="btn-era-time">${nextEra.time}</span></div>`;
            html += '</div>';
        }
        html += '<div class="nav-buttons" style="margin-top:12px">';
        html += `<div class="nav-btn" style="border-color:var(--accent-dim);min-width:auto;padding:10px 24px;font-size:13px" onclick="goBackToEra(${eraId})"><span>↩ 重新抉择</span></div>`;
        html += '</div>';
        html += '</div></div>';

        contentArea.innerHTML = html;
        bindArticleClicks();
        updateInfoPanelForBranch(era, branch);
        scrollToTop();
    }

    function goBackToEra(eraId) {
        eraExpanded = false;
        updateSidebarActive(eraId);
        renderEra(eraId);
        updateInfoPanel(eraId);
        scrollToTop();
    }

    function renderArticleCard(a, idx) {
        const typeClass = getTypeClass(a.type);
        const tagClass = getTagClass(a.type);
        const data = encodeURIComponent(JSON.stringify({
            name: a.name, type: a.catLabel || a.type, tagClass: tagClass,
            intro: a.intro, outline: a.outline, position: a.position,
            structure: a.structure, meta: a.meta, link: a.link
        }));
        return `
    <div class="article-card ${typeClass}" data-idx="${idx}" data-article="${data}">
      <div class="article-card-top">
        <span class="article-card-type-tag ${tagClass}">${a.catLabel || a.type}</span>
        <span class="article-card-title">${a.name}</span>
      </div>
      <div class="article-card-intro">${a.intro}</div>
    </div>`;
    }

    function getTypeClass(t) {
        if (!t) return '';
        const map = { LINE:'type-line', WORLD_LINE:'type-line', PLANING:'type-plan', WORLD_PLANING:'type-plan',
            BACKGROUND:'type-background', WORLD_BACKGROUND:'type-background', THEORY:'type-theory',
            WORLD_THEORY:'type-theory', THOUGHTS_COLLIDE:'type-thought', IF_LINE:'type-ifline' };
        return map[t] || '';
    }

    function getTagClass(t) {
        if (!t) return '';
        const map = { LINE:'tag-line', WORLD_LINE:'tag-line', PLANING:'tag-plan', WORLD_PLANING:'tag-plan',
            BACKGROUND:'tag-background', WORLD_BACKGROUND:'tag-background', THEORY:'tag-theory',
            WORLD_THEORY:'tag-theory', THOUGHTS_COLLIDE:'tag-thought', IF_LINE:'tag-ifline' };
        return map[t] || '';
    }

    function bindArticleClicks() {
        document.querySelectorAll('.article-card').forEach(card => {
            card.addEventListener('click', function() {
                const raw = this.getAttribute('data-article');
                if (!raw) return;
                const data = JSON.parse(decodeURIComponent(raw));
                showArticleModal(data);
            });
        });
    }

    function showBranchArticleModal(el) {
        const data = JSON.parse(decodeURIComponent(el.getAttribute('data-article')));
        showArticleModal(data);
    }

    function showArticleModal(data) {
        let html = `<div class="article-modal-overlay" onclick="closeArticleModal(event)">
    <div class="article-modal" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeArticleModal()">✕</button>
      <span class="modal-type-tag ${data.tagClass}">${data.type}</span>
      <div class="modal-title">${data.name}</div>
      <div class="modal-section"><h5>导言</h5><div>${data.intro}</div></div>
      <div class="modal-section"><h5>概述</h5><div>${data.outline}</div></div>
      <div class="modal-section"><h5>定位</h5><div>${data.position}</div></div>
      <div class="modal-section"><h5>结构</h5><div>${data.structure}</div></div>
      <div class="modal-meta">${data.meta}</div>
      <div class="modal-link">🔗 <a href="${data.link}" target="_blank">${data.link}</a></div>
    </div>
  </div>`;
        closeArticleModal();
        document.body.insertAdjacentHTML('beforeend', html);
        document.body.style.overflow = 'hidden';
    }

    function closeArticleModal(e) {
        if (e && e.target !== e.currentTarget) return;
        const overlay = document.querySelector('.article-modal-overlay');
        if (overlay) { overlay.remove(); document.body.style.overflow = ''; }
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeArticleModal();
    });

    function renderEndingInline(branch) {
        let icon, subtitle;
        if (branch.outcome === 'CONTINUE…') {
            icon = '✦'; subtitle = '故事尚未终结，新的篇章等待书写……';
        } else {
            icon = '◈'; subtitle = '时间线在此处收束。';
        }
        return `<div class="ending-screen" style="padding:30px 0">
    <div class="ending-icon">${icon}</div>
    <div class="ending-line-name">── ${branch.outcome || '结局'} ──</div>
    <div class="ending-title">${branch.article ? branch.article.name : ''}</div>
    <div class="ending-sub">${subtitle}</div>
    <button class="restart-btn" onclick="restartJourney()">⟳ 回到最开始的地方</button>
  </div>`;
    }

    function revealEnding(dataStr) {
        const data = JSON.parse(decodeURIComponent(dataStr));
        const isContinue = data.outcome === 'CONTINUE…';
        const icon = isContinue ? '✦' : '◈';
        const subtitle = isContinue ? '故事尚未终结，新的篇章等待书写……' : '时间线在此处收束。';
        contentArea.innerHTML = `<div class="ending-screen" style="padding:60px 20px;animation:fadeSlideIn 0.5s ease">
    <div class="ending-icon">${icon}</div>
    <div class="ending-line-name">── ${data.outcome || '结局'} ──</div>
    <div class="ending-title">${data.articleName}</div>
    <div class="ending-sub">${subtitle}</div>
    <button class="restart-btn" onclick="restartJourney()">⟳ 回到最开始的地方</button>
  </div>`;
        scrollToTop();
    }

    function goNext(eraId) {
        historyStack.push(currentEraId);
        navigateTo(eraId);
    }

    function renderContinuEnd() {
        return `<div id="nav-area">
    <div class="ending-screen" style="padding:30px 0">
      <div class="ending-icon">✦</div>
      <div class="ending-line-name">── CONTINUE… ──</div>
      <div class="ending-sub">故事尚未终结，新的篇章等待书写……</div>
      <button class="restart-btn" onclick="restartJourney()">⟳ 回到最开始的地方</button>
    </div>
  </div>`;
    }

    function restartJourney() {
        historyStack = [];
        eraExpanded = false;
        navigateTo(1);
    }

    function buildSidebar() {
        let html = '';
        timelineData.forEach(era => {
            const isBranch = era.type === 'branch';
            html += `<div class="tree-node${isBranch?' branch':''}${era.id===currentEraId?' active':''}" data-era="${era.id}" onclick="jumpToEra(${era.id})">
      <div class="tree-node-inner"><div class="tree-dot"></div>
      <div class="tree-label"><span class="era-name">${era.name}</span><span class="era-time">${era.time}</span></div>
      </div></div>`;
        });
        sidebarTree.innerHTML = html;
    }

    function updateSidebarActive(eraId) {
        document.querySelectorAll('.tree-node').forEach(n => n.classList.remove('active'));
        if (eraId !== null) {
            const node = document.querySelector(`.tree-node[data-era="${eraId}"]`);
            if (node) node.classList.add('active');
        }
    }

    function jumpToEra(eraId) {
        historyStack = [];
        eraExpanded = false;
        navigateTo(eraId);
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
    }

    function toggleLeftPanel() {
        const s = document.getElementById('sidebar');
        const tab = document.getElementById('edge-tab-left');
        s.classList.toggle('collapsed');
        if (s.classList.contains('collapsed')) {
            tab.classList.add('shifted');
            tab.textContent = '▶';
            tab.title = '展开目录';
        } else {
            tab.classList.remove('shifted');
            tab.textContent = '◀';
            tab.title = '折叠目录';
        }
    }

    function toggleRightPanel() {
        const p = document.getElementById('era-info-panel');
        const tab = document.getElementById('edge-tab-right');
        p.classList.toggle('collapsed');
        if (p.classList.contains('collapsed')) {
            tab.classList.add('shifted');
            tab.textContent = '◀';
            tab.title = '展开信息栏';
        } else {
            tab.classList.remove('shifted');
            tab.textContent = '▶';
            tab.title = '折叠信息栏';
        }
    }

    const eraIdList = timelineData.map(e => e.id);
    contentArea.addEventListener('wheel', function(e) {
        if (eraExpanded) return;
        const curIdx = eraIdList.indexOf(currentEraId);
        if (e.deltaY > 0 && curIdx < eraIdList.length - 1) {
            e.preventDefault();
            jumpToEra(eraIdList[curIdx + 1]);
        } else if (e.deltaY < 0 && curIdx > 0) {
            e.preventDefault();
            jumpToEra(eraIdList[curIdx - 1]);
        }
    }, { passive: false });

    (function initCanvas() {
        const c = document.getElementById('bg-canvas');
        const ctx = c.getContext('2d');
        let w, h, particles = [];
        function resize() { w = c.width = window.innerWidth; h = c.height = window.innerHeight; }
        resize(); window.addEventListener('resize', resize);
        for (let i = 0; i < 80; i++) {
            particles.push({ x: Math.random()*w, y: Math.random()*h, r: Math.random()*1.5+0.4,
                vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3, a: Math.random()*0.5+0.2 });
        }
        function draw() {
            ctx.clearRect(0,0,w,h);
            ctx.strokeStyle = 'rgba(77,168,218,0.06)'; ctx.lineWidth = 1;
            const gs = 50;
            for (let x = gs; x < w; x += gs) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
            for (let y = gs; y < h; y += gs) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if (p.x<0||p.x>w) p.vx*=-1; if (p.y<0||p.y>h) p.vy*=-1;
                ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
                ctx.fillStyle = `rgba(108,196,240,${p.a})`; ctx.fill();
            });
            for (let i=0;i<particles.length;i++) {
                for (let j=i+1;j<particles.length;j++) {
                    const dx=particles[i].x-particles[j].x, dy=particles[i].y-particles[j].y;
                    const dist=Math.sqrt(dx*dx+dy*dy);
                    if(dist<100){ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);
                        ctx.lineTo(particles[j].x,particles[j].y);
                        ctx.strokeStyle=`rgba(77,168,218,${0.06*(1-dist/100)})`;ctx.stroke();}
                }
            }
            requestAnimationFrame(draw);
        }
        draw();
    })();

    buildSidebar();
    navigateTo(1);
</script>
</body>
