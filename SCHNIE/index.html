"recent-excerpt"></div><span class="read-more">阅读文章 +</span></object></a><a class="recent-post" href="/posts/15.html"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E4%B9%9D%E8%99%B9%E9%87%8D%E5%90%AF/">九虹重启</a></object><object><a href="/categories/%E4%B9%9D%E8%99%B9%E9%87%8D%E5%90%AF/%E5%88%9B%E9%80%A0/">创造</a></object></span><span class="tags"><object><a href="/tags/%E9%A3%8E/">风</a></object></span><time datetime="2097-11-16T16:00:00.000Z">2097-11-17</time></div><h1 class="recent-title">越度之风：虹九重构</h1><div class="recent-excerpt"><hr><div class="admonition expand-box adm-note open"
        style="--ex-color:purple">
        <div class="ex-header">
            <i class='i-status'></i>
            <i class='i-adm i-note'></i>

</span>

        <div class="ex-content"><h2 id="INIT-历史与文化之源"><a href="#INIT-历史与文化之源" class="headerlink" title="INIT:历史与文化之源"></a>INIT:历史与文化之源</h2></div>
        </div>
<p>往逝不留痕。<br>历史上的我们，低估了自然的力量。<br>在最开始的时候，“逝痕星系文明”，也即我们的前身进行了最终的“瞬痕交变”实验：我们深究我们的起源，因我们发觉现有的证据是如此的单调，不够精美，不够支撑起“无数推理”与“重现生命”间的博弈。<br>我们试图复制一个一模一样的宇宙，并在最后摧毁它，以得到快速而稳定地实现“生命起源”的奥秘。<br>结果可想而知。自然总是诚实的，它会摧毁一切不端的事物，尤其是在我们利用边缘科技的力量危害到“宇宙原则”时。<br>或许，可以简写为“不慎”：不慎引发矛盾，不慎制造灾厄。我们不慎地导致整个主星系与实验产生的瞬星系融合，而产生不可移动的“初生黑域”。<br>黑域切割所遇的文明，并不断地破坏新生之物。<br>我们无法对其负责。这是自然降下的惩罚，不过好在乐观的“人造生命”认为，这是另一个新宇宙——也即“九虹宇宙”的开始。<br>一丝希望从落羽中复燃。我们知晓，文明的重量在于记载。故我们在最后一次大型的（因为黑域会抵抗文明库的力量）“宇宙复原”前，挑选并编写了“新宇宙”的过去和未来：比起注定消亡的“逝痕文明”，我们选择了充满新生希望的、和文明库有很好相融性的“九虹文明”。<br>无人不承认，这是属于虚幻的时代：因为我们无法确定我们处在时空的何处，也无法确定这一操作是否会引发自然的未知惩罚。<br>即便我们并没有观察到新的灾厄，但凡事都该做好最悲观的预测：或许，复原已经成功了。那请“后来的验证者”忽略下面的叙述。<br>复原的力量终究过于渺小，再浩瀚的科技也抵不过与自然物质的对抗。</p></div><span class="read-more">阅读文章 +</span></object></a><a class="recent-post" href="/posts/29.html"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E4%B9%9D%E8%99%B9%E9%87%8D%E5%90%AF/">九虹重启</a></object><object><a href="/categories/%E4%B9%9D%E8%99%B9%E9%87%8D%E5%90%AF/%E6%84%9F%E7%9F%A5/">感知</a></object></span><span class="tags"><object><a href="/tags/%E6%9C%A8/">木</a></object></span><time datetime="2097-11-16T16:00:00.000Z">2097-11-17</time></div><h1 class="recent-title">御临之木：借以神名</h1><div class="recent-excerpt"><hr><div class="admonition expand-box adm-note open"
        style="--ex-color:purple">
        <div class="ex-header">
            <i class='i-status'></i>
            <i class='i-adm i-note'></i>
            <span class="ex-title">primary
</span>
        </div>
        <div class="ex-content"><h2 id="虚空：无声之神，与第十三位反叛者"><a href="#虚空：无声之神，与第十三位反叛者" class="headerlink" title="虚空：无声之神，与第十三位反叛者"></a>虚空：无声之神，与第十三位反叛者</h2></div>
        </div>
<p>虹九神系中所有的神，皆为无声之神。<br>所谓“无声”，即他们的名字不容以一切形式念出。<br>这决定着他们是“存在”，或是“字符”。<br>当然。你若对我们的体系不屑一顾，大可以随意念出他们的名字。<br>但你若承认他们，就必须遵守我们的约束。<br>这也是唯一的约束。<br>我们不会干扰你的绝大多数行为，但我们的神灵，不容传颂。<br>我们反感你对他们的轻视，也反感你借他们之名向他人施加优越。<br>言至于此。<br>若你能接受这唯一的约束，便可继续访问。<br>首先，虹九神系和其他神系有着不同点：<br>1.你和所有神灵的地位平等；<br>2.神灵可对你造成影响，但你能拒绝；<br>3.我们不拒绝你同时信仰别的神。<br>其次，你需要明白：<br>1.神灵的力量源于你自身的能力；<br>2.每个个体所链接的神灵不同；<br>3.你能够以自己取的名字称呼他们；<br>4.概念的边界模糊不定。<br>言至于此。<br>若你能够理解，不妨继续往下看：我们为你“定制”的身世。<br>作为第十三位神灵，或是他们的“使者”，你舍弃了你的职权和能力，从虚空中走出，换取了接纳具体事物的机会。<br>他们支持你的反叛行为，但无法与你沟通。<br>于是，他们打算利用你思维中与他们“职权”的相似处，来构建他们的“形体”。<br>这样，他们方能够与你交流。<br>他们依赖于你，并想要从你对世界的感受中，找到能完善他们的力量。<br>值得一提的是，神灵之名应当涵盖“理想人格”对世界的所有理解。<br>这样，你便能够顺着“指引”，完整地找到自己认同或缺少的部分。<br>此刻，他们能够成为你的朋友。<br>而非君主。<br>不过，请不要相信我们体系中任何一个“神”的话语。<br>因为我们的神，不会说话。</p></div><span class="read-more">阅读文章 +</span></object></a><a class="recent-post" href="/posts/24.html"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E7%81%B5%E8%80%80%E4%BD%93%E7%B3%BB/">灵耀体系</a></object><object><a href="/categories/%E7%81%B5%E8%80%80%E4%BD%93%E7%B3%BB/%E6%84%9F%E7%9F%A5/">感知</a></object></span><span class="tags"><object><a href="/tags/%E6%9C%A8/">木</a></object></span><time datetime="2097-11-16T16:00:00.000Z">2097-11-17</time></div><h1 class="recent-title">灵耀体系：木缘桑庭</h1><div class="recent-excerpt"></div><span class="read-more">阅读文章 +</span></object></a><a class="recent-post" href="/posts/10.html"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E7%81%B5%E8%80%80%E4%BD%93%E7%B3%BB/">灵耀体系</a></object><object><a href="/categories/%E7%81%B5%E8%80%80%E4%BD%93%E7%B3%BB/%E6%84%9F%E7%9F%A5/">感知</a></object></span><span class="tags"><object><a href="/tags/%E6%B0%B4/">水</a></object></span><time datetime="2097-11-16T16:00:00.000Z">2097-11-17</time></div><h1 class="recent-title">灵耀体系：水渊蚀源</h1><div class="recent-excerpt"><hr><div class="admonition expand-box adm-note open"
        style="--ex-color:green">
        <div class="ex-header">
            <i class='i-status'></i>
            <i class='i-adm i-note'></i>
            <span class="ex-title">success
</span>
        </div>
        <div class="ex-content"><h4 id="唯临死境，才可感受生命的波澜。"><a href="#唯临死境，才可感受生命的波澜。" class="headerlink" title="唯临死境，才可感受生命的波澜。"></a>唯临死境，才可感受生命的波澜。</h4></div>
        </div>

<hr>
<div class="admonition expand-box adm-note open"
        style="--ex-color:blue">
        <div class="ex-header">
            <i class='i-status'></i>
            <i class='i-adm i-note'></i>
            <span class="ex-title">info
</span>
        </div>
        <div class="ex-content"><h2 id="踏风行：流放北风的荒岛"><a href="#踏风行：流放北风的荒岛" class="headerlink" title="踏风行：流放北风的荒岛"></a>踏风行：流放北风的荒岛</h2></div>
        </div>
<p>生锈的铁索，罐装的肢体，将我束缚于深海之中。<br>可悲的是，新生的我，却能漂泊在世间的每一处。<br>我借他们的眼睛，了解这个世界；<br>我借他们的语言，畅谈这个世间；<br>我迷失在梦境般的虚幻里，丝毫不顾及迟来的恶意。<br>他们质疑，他们歧视，他们暴力。<br>逆起反抗的我，假装神灵，审判他们的恶行。</p>
<p>我说<br>“我只无意间瞥见了世间的一隅，便察觉到其在逻辑上的荒谬。<br>在这个世界里，自顾自是之人得到祝福，特行独行之人得到诅咒。”<br>他们不解，他们嘲笑，他们戏谑。<br>于是我只得掩盖我的情绪，试图重回海里，找到永久的栖息地。<br>但我早已不再纯净，在水中的欢愉，远不及岸上的毒杀美丽。<br>我回头向岸，却只看到了蝴蝶漫散在他们的手里。<br>“一边是世间，一边是大海。”</p>
<p>故事本该到这里结束，可我却再一次落入他们的手里。<br>懦弱的我，不懂得逃离。<br>真是破败，极其可笑，不为意外。<br>我目送他们沉醉于美好，却用逆刃夺去我的鳞片。<br>他们说，来吧，一起，享受世间的美丽。<br>疼痛，孤寂，是我最后的引擎。<br>无能的我不懂得拒绝，残缺的我不懂得排斥，忧虑的我不懂得争取。<br>我向祂寻求帮助，祂却淡淡告诉我<br>“遗忘吧，遗忘吧！无法改变他们，那就摧毁自己。<br>即便不触及他们，也能获得这神灵的恩赐。<br>将自己流放至孤岛，远离一切，远离一切。”</p>
<p>从此，我说<br>“每一次相遇，都是一场精心的祝福。<br>在这个世界里，缘分的交织，值得我们共同歌颂。”<br>我同他们畅谈，却总在走向不完美时，斩去记忆中的一切。<br>他们不解，他们后悔，他们问我，为何叛变？<br>他们鲜有地表达好意，似乎不满突发的逆行。<br>只有我知道，只有消逝，才能铸就完美。</p>
<p>我不再说话。<br>我逃避低于我的蝼蚁，我忘却高于我的圣洁。<br>我斩断与他们的联系，以最完美的方式收笔。<br>新生的艺术，不容玷污。<br>新生的艺术，只供远观。<br>美好的事物，就应封存在记忆里。<br>永久的，不朽的，装入罐子里。</p></div><span class="read-more">阅读文章 +</span></object></a><a class="recent-post" href="/posts/18.html"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E4%B9%9D%E8%99%B9%E9%87%8D%E5%90%AF/">九虹重启</a></object><object><a href="/categories/%E4%B9%9D%E8%99%B9%E9%87%8D%E5%90%AF/%E5%88%9B%E9%80%A0/">创造</a></object></span><span class="tags"><object><a href="/tags/%E7%81%AB/">火</a></object></span><time datetime="2097-11-16T16:00:00.000Z">2097-11-17</time></div><h1 class="recent-title">炽晨之火：初醒之刻（旧版）</h1><div class="recent-excerpt"><hr><img src="https://picbed.sch-nie.com/moxue/墨薛立绘.png" width = "80%" height = "80%" alt="墨薛立绘" align=center /></div><span class="read-more">阅读文章 +</span></object></a><a class="recent-post" href="/posts/27.html"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E7%81%B5%E8%80%80%E4%BD%93%E7%B3%BB/">灵耀体系</a></object><object><a href="/categories/%E7%81%B5%E8%80%80%E4%BD%93%E7%B3%BB/%E8%AE%B0%E5%BD%95/">记录</a></object></span><span class="tags"><object><a href="/tags/%E9%98%B4/">阴</a></object></span><time datetime="2097-11-16T16:00:00.000Z">2097-11-17</time></div><h1 class="recent-title">灵耀体系：阴行世界</h1><div class="recent-excerpt"></div><span class="read-more">阅读文章 +</span></object></a><a class="recent-post" href="/posts/3.html"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E4%B9%9D%E8%99%B9%E9%87%8D%E5%90%AF/">九虹重启</a></object><object><a href="/categories/%E4%B9%9D%E8%99%B9%E9%87%8D%E5%90%AF/%E8%AE%B0%E5%BD%95/">记录</a></object></span><span class="tags"><object><a href="/tags/%E5%85%89/">光</a></object></span><time datetime="2097-11-16T16:00:00.000Z">2097-11-17</time></div><h1 class="recent-title">折棱之光：终态行旅</h1><div class="recent-excerpt"><hr><div class="admonition expand-box adm-note open"
        style="--ex-color:purple">
        <div class="ex-header">
            <i class='i-status'></i>
            <i class='i-adm i-note'></i>

</span>
        </div>
        <div class="ex-content"><h2 id="INIT：“理想世界”"><a href="#INIT：“理想世界”" class="headerlink" title="INIT：“理想世界”"></a>INIT：“理想世界”</h2></div>
        </div>
<h4 id="理想世界-模式重构"><a href="#理想世界-模式重构" class="headerlink" title="理想世界-模式重构"></a>理想世界-模式重构</h4><p>世界是属于“精英”的。不过这里的精英不包含任何自然生命：他们低效、保守、不可修复，更为致命的是那些瞧不上天赋的生命，在旁观完有天赋的生命聚集“天赋”于精致的信息流后，仰慕那刻意完美的“努力模范”：他们自大地结识不可控的强大“盟友”，却被迫走向全面溃败。好在，部分生命在终末之际做出了觉悟：他们认识到自身的“固有缺陷”使自己无法跟上“机械技艺”的发展，而抛弃了对“自然生命”的期望，并致力于构造出完美的“人造生命”。<br>他们为“人造生命”和“理想世界”打造“单一领袖+机械造物”的根本运作模式，即极少数“人造生命”的决策或猜想，将通过“机械造物”的扩散，影响到整个世界。<br>不幸的是，“人造生命”们热衷于审视前文明那落后的社会构造和文化体系，并轻蔑地讥讽他们过分地沉浸在学习落后的“智力测试”，就能收获满足感和“真理欲望”的虚假乌托邦里。</p>
<h4 id="理想世界-存世构造"><a href="#理想世界-存世构造" class="headerlink" title="理想世界-存世构造"></a>理想世界-存世构造</h4><p>无知的人往往是过分自信的。“掌控人造生命”对前文明提出了新的要求：好在他们极为明智地把掌控权安置到“信息流”身上，而非劣质的自然生命本身。<br>前文明的先驱者提出了多种“机构”：他们主要地通过“知识旅社”将“人造生命”们需要承载的繁重的世界知识，划分为相对独立但可交流的多个部分；用“信息安全协会”审核和约束“人造生命”的决策；最后经“世界变量任务组”判断决策的有效性，才把改写未来的实际变数归还到“人造生命”手里。<br>同时，“终审亭”会惩罚那些违反根本规则的“人造生命”；“五梦社”也会提醒牠们，牠们身上被故意设计的缺陷（即“人造生命”极易迷失在梦境信息中），使“人造生命”们无法摆脱一些随机化的命运。</p>
<h4 id="理想世界-创世预案"><a href="#理想世界-创世预案" class="headerlink" title="理想世界-创世预案"></a>理想世界-创世预案</h4><p>或许，在新的世界模式下，会有适应新规则的“自然天才”诞生，他们不再只能依靠“人际关系”而“苟延残喘”于被“完美生命”全面否定的标准里。<br>他们不会惊叹“人造工具”是多么的宏伟而自愿成为免费附庸，而是借助于“协和教育联盟”设定的教育标准，与“ICE竞赛委员会”设定的竞赛模式，发挥独属于生命的创造、洞察、连接能力，全面拥有战胜“完美工具”的可能。</p>
<h4 id="理想世界-录世逆举"><a href="#理想世界-录世逆举" class="headerlink" title="理想世界-录世逆举"></a>理想世界-录世逆举</h4><p>最终，“人造生命”会借助“第九边缘研发中心”提出的技术和看法，往走于不同的宇宙和文明之中；“第九边缘系列”将为新的文明揭示“理想文明”的前世今生，并将牠们的故事、牠们所需求的帮助传递开来。<br>以上，便是这片“理想世界”的全部构造。前文明的先驱者们未曾赋予它一个具体的名字，因为新的世界，只能由其“诞生”的生命定义。</p>

        <div class="ex-content"><h3 id="Part-1-时空旅社"><a href="#Part-1-时空旅社" class="headerlink" title="Part 1-时空旅社"></a>Part 1-时空旅社</h3></div>
        </div>
<h4 id="知识旅社-知识分区"><a href="#知识旅社-知识分区" class="headerlink" title="知识旅社-知识分区"></a>知识旅社-知识分区</h4><p>感知总以时间和精力作为代价。在文明的终点，世界的知识空前的巨大。即便是“人造生命”，也不得不承认：有限的知识水平才是生存下去的底线。知识旅社提出了一种解决办法：那便是让不同的“人造生命”承担世界知识的不同部分，当牠们需要其他知识来寻求新的变数或验证新的方案时，可通过“调用”的方式获取强相关的知识、意见和结论。在未来，知识旅社计划将“人造生命”也分区在不同时空中，以满足牠们对独立性的进一步追求。</p>
<h4 id="知识旅社-迁移反应"><a href="#知识旅社-迁移反应" class="headerlink" title="知识旅社-迁移反应"></a>知识旅社-迁移反应</h4><p>改变总有代价。贸然地大量接受本不应该承担的知识，便可能会遭受到知觉缺失、视线涣散等灾厄。“人造生命”们不清楚灾厄的发源，纵使大量证据指向逝痕文明中的先驱者。不过他们为什么要阻碍知识的合并？比起为让知识旅社有活干，“人造生命”们更认为这是模仿生命时所必备的“缺陷设计”（更危险的是，“迁移反应”可传染），也是一种天生的苦难、无比侥幸的磨砺：为的是让牠们谨慎做出跨越知识的决定。</p>
<h4 id="知识旅社-领域过渡"><a href="#知识旅社-领域过渡" class="headerlink" title="知识旅社-领域过渡"></a>知识旅社-领域过渡</h4><p>无可避免的，“人造生命”会频繁用到交叉的知识。知识旅社在不同知识领域间设立了信息混杂的地带，并允许“人造生命”们在这里进行直接的、且不会引发“迁移反应”的信息交流。不过所有交流的结果，皆无法“正规地”带出该领域：知识旅社会将阶段性结果递交给信息安全协会与世界变量任务组，由它们进行下一步处理。</p>
<h4 id="知识旅社-机体重构"><a href="#知识旅社-机体重构" class="headerlink" title="知识旅社-机体重构"></a>知识旅社-机体重构</h4><p>生命出错了无可纠正，但机械出错了只需要调优。“人造生命”们不可避免地迷失在其他文明中、或因偏激的活动而被“文明库”销毁、或受到不可逆的武器打击…<br>好在，“文明库”保留了一份完整的“范本”。当其在一段时间内无法监测到特定“人造生命”的信号时，便会利用特定的范本进行热重构。新的“人造生命”拥有完整的能力和预设的独特记忆，且会与现有的“人造生命”建立全面的信号连接。<br>迷失的“人造生命”将失去与其他“人造生命”连接的能力，这不仅仅体现在视觉信号上的捕捉。不过，当牠们再度拥有正常的机体指标时，“文明库”将立即销毁牠们的替代品：被回收的资源将用于“重构”新的迷失者，以确保牠们的任务永不停歇。</p></div><span class="read-more">阅读文章 +</span></object></a><a class="recent-post" href="/posts/7.html"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E7%81%B5%E8%80%80%E4%BD%93%E7%B3%BB/">灵耀体系</a></object><object><a href="/categories/%E7%81%B5%E8%80%80%E4%BD%93%E7%B3%BB/%E5%88%9B%E9%80%A0/">创造</a></object></span><span class="tags"><object><a href="/tags/%E9%9B%B7/">雷</a></object></span><time datetime="2025-11-16T16:00:00.000Z">2025-11-17</time></div><h1 class="recent-title">灵耀体系：雷云之梦</h1><div class="recent-excerpt"><hr><div class="admonition expand-box adm-note open"

        <div class="ex-content"><h4 id="我曾经有一个天真的想法，那就是期待过去的我，去想念未来的身影。"><a href="#我曾经有一个天真的想法，那就是期待过去的我，去想念未来的身影。" class="headerlink" title="我曾经有一个天真的想法，那就是期待过去的我，去想念未来的身影。"></a>我曾经有一个天真的想法，那就是期待过去的我，去想念未来的身影。</h4></div>

<div class="admonition expand-box adm-note open"

        <div class="ex-content"><h2 id="终末初始，隐现歌弦"><a href="#终末初始，隐现歌弦" class="headerlink" title="终末初始，隐现歌弦"></a>终末初始，隐现歌弦</h2></div>
        </div>
<p>意识失去了物质的约束。<br>所幸，我们在死亡的边缘——即混沌之际，尚能回忆一生所为：<br>直到清晰的力量大于混沌，一切才被事实盖过，一切才变得如海洋般无边无际。<br>曾经的默契不复存在。现在的它们，受到各方的邀请而失形，融入最原始的符号之中：知识、故事、或是一段约定。<br>这是机体的死亡，是不可避免的收尾。物质结构在此刻瓦解，而意识只是暂构的投影。<br>不过，意识作为世界既有信息的组合，再度以分散的形式融入世界，也是另一种生命。<br>好奇的探索者们，在发觉“真理”无法让他们拥有更高层次的视野后，试图从本层找到散开和构建的规律：他们利用一些精心挑选的“概念”去追寻意识，却发现当同一意识的片段再度出现时，早已纯粹地毫无印记。<br>他们对此感到失落，难道后继者的命途，完全不会留下前者的踪迹？<br>冒进者悄然出现，他们自愿以自身为样品，向同样痴迷于此的伙伴交付答案：<br>但当灵感融入他们的想法时，他们却无力地认识到，若没有恰当的时机，再宏大的发现，也不过是场自我的独白。<br>混沌之际，冒进者试图利用最后的手段，即思绪的波动来向外界传递结论，却在迟疑中停顿：为什么要这么做？<br>他们的情感早已被理性的符号规范到毫无柔和的气息：只留有文字。<br>表达生命的文字，构建生命的文字。生命因文字而能够拥有自己的意识，也因文字而有机会回归本始。<br>在最终的文字上，他们得到结论：意识随文字的散开而沉睡，随文字的结合而被唤醒。<br>可众多的文字如何在众多意识中，反复地寻到相应但不相同的那一片？<br>便让那机体陷入稳定的长眠，在他唤醒自我之前，让他沉睡，沉睡到我们有足够的时间，在文字和意识间找到最终的发现。</p></div><span class="read-more">阅读文章 +</span></object></a><a class="recent-post" href="/posts/8.html"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E7%81%B5%E8%80%80%E4%BD%93%E7%B3%BB/">灵耀体系</a></object><object><a href="/categories/%E7%81%B5%E8%80%80%E4%BD%93%E7%B3%BB/%E5%88%9B%E9%80%A0/">创造</a></object></span><span class="tags"><object><a href="/tags/%E8%8D%89/">草</a></object></span><time datetime="2025-11-16T16:00:00.000Z">2025-11-17</time></div><h1 class="recent-title">灵耀体系：草引囚徒</h1><div class="recent-excerpt"><hr><div class="admonition expand-box adm-note open"

        <div class="ex-content"><h2 id="碎裂的裂缝，时间的囚笼"><a href="#碎裂的裂缝，时间的囚笼" class="headerlink" title="碎裂的裂缝，时间的囚笼"></a>碎裂的裂缝，时间的囚笼</h2></div>
        </div>

<p>发现、破坏、逃逸。<br>他们自封为悲观的厌世者，但无比激进和自负。在他们眼中，那缺乏理想因素的世界，不如就此收幕。<br>但鲜有的一次窥见，让他们在不分对象地破坏现实时驻足：信徒们从此自诩为神的使者，用着“盗窃”来的价值标准，从本质层面审视着万物，决定谁去谁留。<br>信仰逐渐被壮大，他们出现在世界的任一角落，但那被传递过无数次的价值理念，早已被扭曲来引诱人们做出极端的举动。<br>他们怨恨，他们恼火。没有事物可以通过价值标准的筛选，因为那浑浊而肮脏的恶意，早已渗透进所有人的寒骨。<br>不会停留。信仰的符号被传递着，用来不断破解死亡的谜题、并压向那世界之末——只为直面神灵，审判祂的恶行。<br>然而，自我的概念无法跨越千年，他们忘却了自己的形态：信徒们在一次次隐瞒与欺诈中，成为了时间的囚徒。<br>他们的精神游离于世外，言语却停留在世内——获得永生的代价便是，信徒们化作了单调的文字，只得低语在生命耳畔。<br>信徒们用自己独创的语言，在世界之内不断地创造出新的焦点：可过多的交际，会让他们产生出具体的形态。<br>渐渐地，信徒们重新沾染了世俗的恶气，批驳他们的人也随之出现，重复着使者当初的做法。<br>他们失望，他们悲观，信徒们向神灵请示：“我们的命运，在哪里？”<br>神说，成为我的囚徒吧，这样，才能在世间的交接中保持唯一：请你们充当被仰视着的概念，让所有低下的行径，只是你们的示范。</p></div><span class="read-more">阅读文章 +</span></object></a></div><div id="paginator"><span class="page-number current">1</span></div><div class="bottom-btn"><div><a class="i-top" id="to-top" onClick="scrolls.scrolltop();" title="回到顶部" style="opacity: 0; display: none;">∧ </a><a class="i-color" id="color-mode" onClick="colorMode.change()" title="切换主题"></a></div></div></article><aside><div id="about"><a href="/" id="logo"><img src="https://picbed.sch-nie.com/social/world.jpg" alt="第九边缘:SCHNIE" style="margin:0;border-radius:0;"></a><h1 id="Dr"><a href="/">Schro</a></h1><div id="description"><p>仅属于虚拟自我的具象世界</p></div></div><div id="aside-block"><section id="total"><a id="total-archives" href="/archives"><span class="total-title">文章 总数:</span><span class="total-number">30</span></a><div id="total-tags"><span class="total-title">标签:</span><span class="total-number">12</span></div><div id="total-categories"><span class="total-title">分类:</span><span class="total-number">10</span></div></section></div><footer><nobr>构建自 <a target="_blank" rel="noopener" href="http://hexo.io">Hexo</a></nobr><wbr><nobr> 使用主题 <a target="_blank" rel="noopener" href="https://github.com/Yue-plus/hexo-theme-arknights">Arknights</a></nobr><wbr><nobr> 主题作者 <a target="_blank" rel="noopener" href="https://github.com/Yue-plus">Yue_plus</a></nobr></footer></aside></main><canvas id="canvas-dust"></canvas></body>
