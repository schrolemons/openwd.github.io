        /* Final editor visual polish: unified, softer, non-invasive */

<body>
<header class="app-header">
    <div class="brand">
        <div class="brand-mark">✦</div>
        <div>
            <h1>个人扩列条可视化编辑器</h1>
            <p>单文件运行。左侧编辑配置，右侧实时预览，导出完整 HTML。</p>
        </div>
    </div>
    <div class="header-actions">
        <button class="btn ghost" onclick="document.getElementById('import-file').click()">导入 JSON</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden onchange="importJSONFile(event)">
        <button class="btn ghost" onclick="copyHTML()">复制 HTML</button>
        <button class="btn accent" onclick="downloadJSON()">导出 JSON</button>
        <button class="btn primary" onclick="downloadHTML()">导出完整 HTML</button>
    </div>
</header>
<main class="workspace">
    <aside class="editor-panel">
        <div class="panel-title">
            <div><h2>编辑区</h2><span>支持拖拽排序、点击增删、输入修改</span></div>
            <button class="btn small danger" onclick="resetConfig()">重置</button>
        </div>
        <div class="editor-scroll" id="editor-root"></div>
    </aside>
    <section class="preview-panel">
        <div class="preview-toolbar">
            <div><strong>实时预览</strong> <span style="color:#64748b;font-size:12px">导出时会移除编辑器，只保留扩列条页面</span></div>
            <button class="btn small ghost" onclick="refreshPreview()">刷新预览</button>
        </div>
        <iframe id="preview-frame" class="preview-frame" title="扩列条预览"></iframe>
    </section>
</main>
<div class="toast" id="toast"></div>

    function h(v){return String(v ?? '').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

    function pathParts(path){return String(path).split('.').map(p=>/^\d+$/.test(p)?Number(p):p);}

    function setPath(path,value){const parts=pathParts(path); let obj=state; for(let i=0;i<parts.length-1;i++){ if(obj[parts[i]] == null) obj[parts[i]] = typeof parts[i+1] === 'number' ? [] : {}; obj=obj[parts[i]]; } obj[parts.at(-1)] = value; persist(); schedulePreview();}
    function deleteAt(arrayPath,index){const arr=getPath(arrayPath); if(Array.isArray(arr)){arr.splice(index,1); renderEditor(); persist(); refreshPreview();}}

    function moveInArray(arrayPath,from,to){const arr=getPath(arrayPath); if(!Array.isArray(arr)||from===to||from<0||to<0||from>=arr.length||to>=arr.length)return; const [it]=arr.splice(from,1); arr.splice(to,0,it); renderEditor(); persist(); refreshPreview();}

    function addMenu(label, options){

    function toggleAddMenu(button,event){
        if(event){event.preventDefault();event.stopPropagation();}
        const menu=button.closest('.add-menu');
        const wasOpen=menu.classList.contains('open');
        document.querySelectorAll('.add-menu.open').forEach(m=>{if(m!==menu)m.classList.remove('open')});
        menu.classList.toggle('open',!wasOpen);
        if(!wasOpen) requestAnimationFrame(()=>positionAddMenu(menu));
    }
    function positionAddMenu(menu){
        if(!menu || !menu.classList.contains('open')) return;
        const btn=menu.querySelector('.add-trigger'), pop=menu.querySelector('.add-popover');
        if(!btn||!pop) return;
        const rect=btn.getBoundingClientRect();
        const width=pop.offsetWidth||260, height=pop.offsetHeight||220;
        const margin=12;
        let left=Math.min(Math.max(rect.right-width,margin),window.innerWidth-width-margin);
        let top=rect.bottom+8;
        if(top+height>window.innerHeight-margin) top=rect.top-height-8;
        if(top<margin) top=margin;
        pop.style.left=left+'px';
        pop.style.top=top+'px';
    }

    function renderSectionItem(item,index){const secPath=item.id; if(!state[secPath]) state[secPath]={blocks:[]}; return `<div class="array-card section-card" data-editor-target="section:${attr(secPath)}" data-array-path="toc" data-index="${index}" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropOn(event)">

    function addSection(template='blank'){let n=state.toc.length+1; let id=`custom_${n}`; while(state[id]){n++;id=`custom_${n}`;} const presets={blank:{title:'自定义板块',icon:'fa-star',section:{blocks:[]}},overview:{title:'概述',icon:'fa-star',section:clone(DEFAULT_CONFIG.overview)},friendship:{title:'个人扩列条',icon:'fa-heart',section:clone(DEFAULT_CONFIG.friendship)},media:{title:'个人媒体',icon:'fa-picture-o',section:clone(DEFAULT_CONFIG.personal_media)},friends:{title:'亲友',icon:'fa-heart',section:{blocks:[makeBlock('friends_group')]}}}; const preset=presets[template]||presets.blank; state.toc.push({id,title:preset.title,icon:preset.icon}); state[id]=clone(preset.section); renderEditor(); persist(); refreshPreview();}

    function selectorForEditorTarget(target){
        return '[data-editor-target="'+String(target).replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"]';
    }
    function getEditorTargetFromNode(node){
        const hit=node&&node.closest?node.closest('[data-editor-target]'):null;
        return hit&&hit.dataset?hit.dataset.editorTarget:null;
    }
    function attachEditorInteractionBridge(){
        const root=document.getElementById('editor-root');
        if(!root||root.__previewBridgeInstalled) return;
        root.__previewBridgeInstalled=true;
        ['click','focusin','input','change'].forEach(type=>root.addEventListener(type,(event)=>{
            const target=getEditorTargetFromNode(event.target);
            if(target) focusPreviewFromEditor(target);
        },true));
    }
    function focusPreviewFromEditor(source){
        const target=typeof source==='string'?source:getEditorTargetFromNode(source);
        if(!target) return;
        pendingPreviewTarget=target;
        scrollPreviewToEditorTarget(target,{highlight:true});
    }
    function scrollPreviewToEditorTarget(target,options={}){
        const frame=document.getElementById('preview-frame');
        try{
            const doc=frame&&frame.contentDocument;
            if(!doc) return false;
            const node=doc.querySelector(selectorForEditorTarget(target));
            if(!node) return false;
            node.scrollIntoView({behavior:options.instant?'auto':'smooth',block:'center',inline:'nearest'});
            if(options.highlight!==false){
                doc.querySelectorAll('.preview-focus-highlight').forEach(el=>el.classList.remove('preview-focus-highlight'));
                node.classList.add('preview-focus-highlight');
                clearTimeout(node.__previewFocusTimer);
                node.__previewFocusTimer=setTimeout(()=>node.classList.remove('preview-focus-highlight'),1500);
            }
            return true;
        }catch(e){return false;}
    }
    function schedulePreview(){clearTimeout(previewTimer); previewTimer=setTimeout(()=>refreshPreview({preserveScroll:true}),180);}
    function getPreviewScrollState(){
        const frame=document.getElementById('preview-frame');
        try{const win=frame.contentWindow; return win?{x:win.scrollX||0,y:win.scrollY||0}:null;}catch(e){return null;}
    }
    function refreshPreview(options={}){
        normalizeConfig(state);
        const frame=document.getElementById('preview-frame');
        const keep=options.preserveScroll!==false;
        const scroll=keep?getPreviewScrollState():null;
        const target=pendingPreviewTarget;
        frame.onload=()=>{
            attachPreviewClickBridge();
            if(target&&scrollPreviewToEditorTarget(target,{instant:true,highlight:true})){
                pendingPreviewTarget=null;
            }else if(scroll){
                try{frame.contentWindow.scrollTo(scroll.x,scroll.y);}catch(e){}
            }
        };
        frame.srcdoc = generateProfileHTML(state);
    }
    function attachPreviewClickBridge(){
        const frame=document.getElementById('preview-frame');
        try{
            const doc=frame.contentDocument;
            if(!doc||doc.__editorBridgeInstalled) return;
            doc.__editorBridgeInstalled=true;
            doc.addEventListener('click',(event)=>{
                const el=event.target.closest&&event.target.closest('[data-editor-target]');
                if(el&&el.dataset.editorTarget) focusEditorTarget(el.dataset.editorTarget);
            },true);
        }catch(e){}
    }
    function focusEditorTarget(target){
        const candidates=[target];
        if(target.startsWith('item:')){
            const p=target.slice(5).split('.');
            while(p.length>0){
                candidates.push('item:'+p.join('.'));
                if(p[p.length-2]==='blocks'){candidates.push('block:'+p.join('.')); break;}
                p.pop();
            }
        }
        if(target.startsWith('block:')){
            const parts=target.slice(6).split('.');
            candidates.push('section:'+parts[0]);
        }
        let node=null;
        for(const candidate of candidates){
            node=[...document.querySelectorAll('[data-editor-target]')].find(el=>el.dataset.editorTarget===candidate);
            if(node) break;
        }
        if(!node) return;
        node.closest('details')?.setAttribute('open','');
        node.querySelectorAll('details').forEach(d=>d.setAttribute('open',''));
        node.scrollIntoView({behavior:'smooth',block:'center'});
        document.querySelectorAll('.editor-focus-highlight').forEach(el=>el.classList.remove('editor-focus-highlight'));
        node.classList.add('editor-focus-highlight');
        clearTimeout(node.__focusTimer);
        node.__focusTimer=setTimeout(()=>node.classList.remove('editor-focus-highlight'),1600);
    }

    function hexToRgb(hex){hex=String(hex||'#000000').replace('#',''); if(hex.length===3) hex=hex.split('').map(x=>x+x).join(''); const n=parseInt(hex,16); return [(n>>16)&255,(n>>8)&255,n&255];}

        text=text.replace(/highlight-primary\(([^)]+)\)/g,(m,v)=>put(`<span class="highlight-primary">${h(v.trim())}</span>`));
        text=text.replace(/highlight-accent\(([^)]+)\)/g,(m,v)=>put(`<span class="highlight-accent">${h(v.trim())}</span>`));
        text=text.replace(/highlight\(([^)]+)\)/g,(m,v)=>put(`<span class="highlight-accent">${h(v.trim())}</span>`));

        for(const [k,v] of slots) text=text.replaceAll(k,v);
        return text;
    }

function confirmCloseSummary(){closeConfirmModal(); if(pendingCloseId){performCloseSection(pendingCloseId,window.__config.tocMap||{}); pendingCloseId=null;}}
function closeConfirmModal(e){if(e&&e.target!==e.currentTarget)return; const m=document.getElementById('confirm-modal'); if(m)m.classList.remove('active');}
function checkAllClosed(){const ids=window.__config.sectionIds||[]; const all=ids.every(id=>{const s=document.getElementById(id);return !s||s.style.display==='none'}); const w=document.getElementById('final-warning'),f=document.querySelector('footer'); if(all&&w){w.classList.add('active'); if(f)f.style.display='none';}}
let tocOpen=false; function toggleToc(){tocOpen=!tocOpen; document.getElementById('toc-panel').classList.toggle('active',tocOpen);} function scrollToSection(id){const s=document.getElementById(id); if(s)s.scrollIntoView({behavior:'smooth'}); tocOpen=false; const p=document.getElementById('toc-panel'); if(p)p.classList.remove('active');}
window.addEventListener('scroll',function(){const ids=window.__config.sectionIds||[],items=document.querySelectorAll('.toc-item'); let current=ids[0]; ids.forEach(id=>{const s=document.getElementById(id); if(s&&s.getBoundingClientRect().top<=150)current=id;}); items.forEach((it,i)=>it.classList.toggle('active',ids[i]===current));});
function scrollToTop(){window.scrollTo({top:0,behavior:'smooth'});} function scrollToBottom(){window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeLightbox();closeHobbyModal();closePersonalityModal();closeConfirmModal();} if(e.key==='ArrowLeft'||e.key==='ArrowRight'){const gs=window.__config.galleries||[]; let closest=null,min=Infinity; gs.forEach(g=>{const el=document.querySelector('[data-gallery="'+g.id+'"]'); if(el){const r=el.getBoundingClientRect(); if(r.top<innerHeight&&r.bottom>0&&Math.abs(r.top)<min){min=Math.abs(r.top);closest=g;}}}); if(closest){e.key==='ArrowLeft'?prevSlide(closest.id):nextSlide(closest.id);}}});`;
    }

    // Keep section object in sync when the user edits a toc id. This wrapper detects toc.*.id changes.
    const originalSetPath = setPath;
    setPath = function(path,value){
        const m=String(path).match(/^toc\.(\d+)\.id$/);
        if(m){const i=Number(m[1]); const old=state.toc[i]?.id; const next=syncSectionId(old,value,i); value=next;}
        originalSetPath(path,value);
    };

    renderEditor();
    refreshPreview();
    document.documentElement.style.setProperty('--editor-primary',state.colors?.day?.primary||'#3b82f6');
    document.documentElement.style.setProperty('--editor-accent',state.colors?.day?.accent||'#06b6d4');
</script>
